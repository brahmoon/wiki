<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki ログイン</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #f5f5f5;
            color: #37352f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: min(420px, 100%);
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 18px 48px rgba(15, 15, 15, 0.08);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
        }

        .login-description {
            font-size: 14px;
            color: #6b6a67;
            line-height: 1.6;
        }

        .status-message {
            font-size: 13px;
            line-height: 1.5;
            color: #55534e;
        }

        .status-message.status-error {
            color: #c0352b;
        }

        .status-message.status-success {
            color: #0f7b6c;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            height: 44px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-primary {
            background: #2383e2;
            color: #fff;
            border-color: #1d70c4;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1a6bc2;
        }

        .btn-secondary {
            background: #f7f6f3;
            border-color: #e9e9e7;
            color: #37352f;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #ebe9e4;
        }

        .btn-danger {
            background: #fff4f2;
            border-color: #f0b8b2;
            color: #c0352b;
        }

        .btn-danger:hover:not(:disabled) {
            background: #fbe0db;
        }

        .profile-card {
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #e0dfdc;
            background: #fafaf9;
        }

        .profile-card img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 16px;
            font-weight: 600;
        }

        .profile-username {
            font-size: 14px;
            color: #37352f;
            margin-top: 4px;
        }

        .profile-login-id {
            font-size: 13px;
            color: #6b6a67;
        }

        .profile-email,
        .profile-kingdom,
        .profile-language {
            font-size: 13px;
            color: #6b6a67;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div>
            <div class="login-title">Googleアカウントでログイン</div>
            <p class="login-description">
                編集ツールの利用にはGoogleアカウントでのログインが必要です。ログイン後はブラウザに保持され、
                ログアウトするまで再認証は不要です。
            </p>
        </div>
        <div id="profile" class="profile-card" style="display: none;"></div>
        <div id="status" class="status-message" role="status" aria-live="polite"></div>
        <div class="button-group">
            <button id="login-btn" class="btn-primary" type="button" disabled>Googleでログイン</button>
            <button id="return-btn" class="btn-secondary" type="button">エディタに戻る</button>
            <button id="logout-btn" class="btn-danger" type="button" style="display: none;">ログアウト</button>
        </div>
    </div>
    <script>
        const CONFIG = {
            CLIENT_ID: '680055548295-hv2bpt4untk1agai47l5c33p7hdp6hro.apps.googleusercontent.com',
            LOGIN_STORAGE_KEY: 'wikiLoginState',
            DEFAULT_REDIRECT_PATH: 'edit.html',
            APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbz8RHW0K_yLUeYX7sbTjtdrxahsQMtuMzm9mn-kyIOCec2QOt7zu6Eo8Apv1PrAlkw/exec'
        };

        const state = {
            googleClient: null,
            isRequesting: false
        };

        const params = new URLSearchParams(window.location.search);
        const redirectPathParam = (params.get('redirect') || '').trim();
        const redirectPageParam = (params.get('page') || '').trim();

        const redirectTarget = {
            path: redirectPathParam || CONFIG.DEFAULT_REDIRECT_PATH,
            page: redirectPageParam
        };

        const elements = {
            loginButton: document.getElementById('login-btn'),
            returnButton: document.getElementById('return-btn'),
            logoutButton: document.getElementById('logout-btn'),
            status: document.getElementById('status'),
            profile: document.getElementById('profile')
        };

        const APP_SCRIPT_REQUEST_TIMEOUT = 20000;

        const callAppsScript = async (payload) => {
            if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.includes('YOUR_DEPLOYMENT_ID')) {
                throw new Error('Apps ScriptのURLが設定されていません。管理者にお問い合わせください。');
            }

            const controller = new AbortController();
            const timer = window.setTimeout(() => controller.abort(), APP_SCRIPT_REQUEST_TIMEOUT);

            try {
                const response = await fetch(CONFIG.APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors',
                    credentials: 'omit',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });

                if (!response.ok) {
                    const errorText = await response.text().catch(() => '');
                    throw new Error(`Apps Scriptとの通信に失敗しました (HTTP ${response.status})${errorText ? `: ${errorText}` : ''}`);
                }

                const result = await response.json().catch(() => null);
                if (!result) {
                    throw new Error('Apps Scriptからのレスポンスの解析に失敗しました。');
                }

                return result;
            } catch (error) {
                if (error.name === 'AbortError') {
                    throw new Error('Apps Scriptへのリクエストがタイムアウトしました。');
                }
                throw error;
            } finally {
                window.clearTimeout(timer);
            }
        };

        const getStoredLoginState = () => {
            try {
                const value = localStorage.getItem(CONFIG.LOGIN_STORAGE_KEY);
                return value ? JSON.parse(value) : null;
            } catch (error) {
                console.error('Failed to parse login state', error);
                return null;
            }
        };

        const setStatus = (message, type = '') => {
            elements.status.textContent = message;
            elements.status.classList.remove('status-error', 'status-success');
            if (type) {
                elements.status.classList.add(type);
            }
        };

        const renderProfile = (user) => {
            if (!user) {
                elements.profile.style.display = 'none';
                elements.profile.innerHTML = '';
                return;
            }
            const image = user.picture
                ? `<img src="${user.picture}" alt="${user.name}のプロフィール写真">`
                : '';
            const displayName = user.username || user.name;
            const googleName = user.username && user.name ? `<div class="profile-username">Google表示名: ${user.name}</div>` : '';
            const loginIdRow = user.loginId ? `<div class="profile-login-id">ログインID: ${user.loginId}</div>` : '';
            const kingdomRow = user.kingdom ? `<div class="profile-kingdom">所属王国: ${user.kingdom}</div>` : '';
            const languageValue = user.language ? user.language.toUpperCase() : '';
            const languageRow = languageValue ? `<div class="profile-language">言語: ${languageValue}</div>` : '';
            elements.profile.innerHTML = `
                ${image}
                <div>
                    <div class="profile-name">${displayName}</div>
                    ${googleName}
                    ${loginIdRow}
                    <div class="profile-email">${user.email}</div>
                    ${kingdomRow}
                    ${languageRow}
                </div>
            `;
            elements.profile.style.display = 'flex';
        };

        const buildRedirectUrl = () => {
            const url = new URL(redirectTarget.path, window.location.href);
            if (redirectTarget.page) {
                url.searchParams.set('page', redirectTarget.page);
            }
            return url.toString();
        };

        const buildReturnUrl = () => {
            if (redirectTarget.page) {
                const url = new URL('view.html', window.location.href);
                url.searchParams.set('page', redirectTarget.page);
                return url.toString();
            }
            return buildRedirectUrl();
        };

        const updateUI = () => {
            const loginState = getStoredLoginState();
            if (loginState?.user) {
                elements.loginButton.style.display = 'none';
                elements.logoutButton.style.display = '';
                renderProfile(loginState.user);
                const displayName = loginState.user.username || loginState.user.name;
                setStatus(`${displayName} としてログインしています`, 'status-success');
            } else {
                elements.loginButton.style.display = '';
                elements.logoutButton.style.display = 'none';
                renderProfile(null);
                if (!elements.status.classList.contains('status-error')) {
                    setStatus('Googleでログインするとエディタの利用が可能になります。');
                }
            }
            elements.loginButton.disabled = !state.googleClient || state.isRequesting;
        };

        const saveLoginState = (tokenResponse, user) => {
            const loginState = {
                accessToken: tokenResponse.access_token,
                expiresIn: tokenResponse.expires_in,
                obtainedAt: Date.now(),
                user
            };
            localStorage.setItem(CONFIG.LOGIN_STORAGE_KEY, JSON.stringify(loginState));
        };

        const verifyLoginId = async (user) => {
            const payload = {
                action: 'verifyLogin',
                loginId: user.email,
                email: user.email,
                googleEmail: user.email,
                name: user.name,
                googleName: user.name
            };

            const result = await callAppsScript(payload);

            if (!result.success) {
                throw new Error(result.message || 'このアカウントは利用権限がありません。');
            }

            const kingdomValue = typeof result.kingdom !== 'undefined' && result.kingdom !== null && result.kingdom !== ''
                ? String(result.kingdom)
                : '';
            const languageValue = typeof result.language === 'string' && result.language.trim()
                ? result.language.trim().toLowerCase()
                : '';
            const authorityValue = typeof result.authority !== 'undefined' && result.authority !== null
                ? result.authority
                : '';

            return {
                loginId: result.loginId || user.email,
                username: result.username || user.name,
                email: result.email || user.email,
                kingdom: kingdomValue,
                language: languageValue,
                authority: authorityValue
            };
        };

        const revokeAccessToken = async (token) => {
            if (!token) return;
            try {
                await fetch('https://oauth2.googleapis.com/revoke', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `token=${encodeURIComponent(token)}`
                });
            } catch (error) {
                console.warn('Failed to revoke token', error);
            }
        };

        const handleLoginSuccess = async (tokenResponse) => {
            state.isRequesting = true;
            updateUI();
            try {
                const userResponse = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
                    headers: {
                        Authorization: `Bearer ${tokenResponse.access_token}`
                    }
                });
                if (!userResponse.ok) {
                    throw new Error('ユーザー情報の取得に失敗しました');
                }
                const user = await userResponse.json();
                setStatus('アカウントを確認しています...');
                const verified = await verifyLoginId(user);
                const verifiedUser = {
                    ...user,
                    username: verified.username,
                    loginId: verified.loginId,
                    email: verified.email,
                    kingdom: verified.kingdom,
                    language: verified.language,
                    authority: verified.authority
                };
                saveLoginState(tokenResponse, verifiedUser);
                const displayName = verifiedUser.username || verifiedUser.name;
                setStatus(`${displayName} としてログインしました。数秒後にエディタへ戻ります。`, 'status-success');
                updateUI();
                setTimeout(() => {
                    window.location.href = buildRedirectUrl();
                }, 1500);
            } catch (error) {
                console.error(error);
                setStatus(error.message || 'ログイン処理でエラーが発生しました。', 'status-error');
                await revokeAccessToken(tokenResponse?.access_token);
                localStorage.removeItem(CONFIG.LOGIN_STORAGE_KEY);
            } finally {
                state.isRequesting = false;
                updateUI();
            }
        };

        const initializeGoogleClient = () => {
            if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
                setTimeout(initializeGoogleClient, 200);
                return;
            }
            state.googleClient = window.google.accounts.oauth2.initTokenClient({
                client_id: CONFIG.CLIENT_ID,
                scope: 'openid https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
                callback: handleLoginSuccess
            });
            elements.loginButton.disabled = false;
            updateUI();
        };

        const handleLoginClick = () => {
            if (!state.googleClient || state.isRequesting) {
                return;
            }
            setStatus('Googleに接続しています...');
            state.googleClient.requestAccessToken();
        };

        const handleLogoutClick = async () => {
            const loginState = getStoredLoginState();
            await revokeAccessToken(loginState?.accessToken);
            localStorage.removeItem(CONFIG.LOGIN_STORAGE_KEY);
            setStatus('ログアウトしました。', 'status-success');
            updateUI();
        };

        elements.loginButton.addEventListener('click', handleLoginClick);
        elements.logoutButton.addEventListener('click', handleLogoutClick);
        elements.returnButton.addEventListener('click', () => {
            window.location.href = buildReturnUrl();
        });

        window.addEventListener('storage', (event) => {
            if (event.key === CONFIG.LOGIN_STORAGE_KEY) {
                updateUI();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            initializeGoogleClient();
            updateUI();
        });
    </script>
</body>
</html>
