<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wikiページ表示</title>
  <link rel="stylesheet" href="./styles/editor.css">
  <script src="./scripts/appsScriptEndpoints.js"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f5;
      color: #37352f;
    }

    .view-app {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
      background: inherit;
      transition: grid-template-columns 0.3s ease;
    }

    .view-app.sidebar-closed {
      grid-template-columns: 0 1fr;
    }

    .view-app.sidebar-closed .sidebar {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar {
      background: #f7f6f3;
      border-right: 1px solid #e9e9e7;
      padding: 24px 0;
      transition: opacity 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 0 20px 20px;
      border-bottom: 1px solid #e9e9e7;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 24px 20px;
      border-top: 1px solid #e9e9e7;
      background: #f7f6f3;
    }

    .login-status {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
      color: #55534e;
    }

    .login-status-text {
      line-height: 1.4;
    }

    .login-actions {
      display: flex;
      gap: 8px;
    }

    .login-actions .btn {
      flex: 1;
    }

    .sidebar-list,
    .sidebar-sublist {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 0 24px;
    }

    .sidebar-item {
      padding: 0;
      margin: 2px 0;
    }

    .sidebar-link {
      display: block;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      padding: 6px 12px;
      padding-left: calc(12px + var(--sidebar-indent-level, 0) * 16px);
      border-radius: 6px;
      transition: background 0.1s ease;
      margin: 0 12px;
    }

    .sidebar-link:hover {
      background: #e9e9e7;
    }

    .sidebar-item.active > .sidebar-link {
      background: #2383e2;
      color: #fff;
    }

    .sidebar-item.active-ancestor > .sidebar-link {
      background: #e9e9e7;
      font-weight: 600;
    }

    .sidebar-sublist {
      margin-top: 4px;
    }

    .view-main {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .view-container {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px 80px;
      width: 100%;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    .sidebar-toggle {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #d3d2ce;
      background: #fff;
      cursor: pointer;
      transition: background 0.2s, border 0.2s;
    }

    .sidebar-toggle:hover {
      background: #f7f6f3;
    }

    .sidebar-toggle span {
      width: 18px;
      height: 2px;
      background: #37352f;
      border-radius: 99px;
    }

    .breadcrumb {
      font-size: 14px;
      color: #6b6b67;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 16px;
    }

    .edit-button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #d3d2ce;
      background: #fff;
      color: #37352f;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, border 0.2s;
    }

    .edit-button:hover {
      background: #f7f6f3;
    }

    .edit-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid #d3d2ce;
      background: #fff;
      color: #37352f;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      background: #f7f6f3;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #2383e2;
      border-color: #1d70c4;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1a6bc2;
    }

    .btn[hidden] {
      display: none !important;
    }

    .breadcrumb a {
      color: inherit;
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .page-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      padding: 40px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 16px;
      line-height: 1.3;
    }

    .page-updated {
      font-size: 13px;
      color: #6b6b67;
      margin-bottom: 24px;
    }

    .page-content {
      font-size: 16px;
      line-height: 1.7;
    }

    .page-content img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .status-message {
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 8px;
      background: #fff8e6;
      border: 1px solid #f3d29b;
      color: #9b6b2f;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .status-message.error {
      background: #ffecec;
      border-color: #f2a7a7;
      color: #b14242;
    }

    .page-link-card {
      display: block;
      text-decoration: none;
      border: 1px solid #e2e1de;
      border-radius: 12px;
      padding: 14px 16px;
      background: #fdfdfc;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
      color: inherit;
      margin: 16px 0;
    }

    .page-link-card:hover {
      border-color: #d4d3cf;
    }

    .page-link-card__title {
      font-size: 16px;
      font-weight: 600;
      color: #2e2d2a;
      margin-bottom: 4px;
    }

    .page-link-card__meta {
      font-size: 12px;
      color: #6b6b67;
    }

    .hero-skillset-card {
      border: 1px solid #dfddd8;
      border-radius: 14px;
      background: #fdfdfb;
      padding: 14px;
      margin: 14px 0;
      font-size: 13px;
    }

    .hero-skillset-card__body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-skillset-card__grid {
      border: 1px solid #e6e4df;
      border-radius: 12px;
      background: #fff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-skillset-card__row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-skillset-card__row-content {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: stretch;
    }

    .hero-skillset-card__skills {
      display: grid;
      grid-template-columns: repeat(4, minmax(68px, 1fr));
      gap: 8px;
      flex: 1;
      min-width: 220px;
    }

    .hero-skillset-slot {
      border: 1px solid #dedcd7;
      border-radius: 14px;
      background: #fff;
      padding: 12px;
    }

    .hero-skillset-cell {
      border: 1px solid #e2e0da;
      border-radius: 10px;
      background: #fdfcf9;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 60px;
      font-family: inherit;
      text-align: left;
      color: #3e3d38;
    }

    .hero-skillset-cell:is(button) {
      cursor: pointer;
    }

    .hero-skillset-cell--hero {
      flex: 0 0 auto;
      min-width: 180px;
    }

    .hero-skillset-cell--skill {
      width: 100%;
    }

    .hero-skillset-cell__figure {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: #f3f2f0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .hero-skillset-cell__figure img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-skillset-cell__placeholder {
      font-size: 22px;
      color: #b0aea8;
    }

    .hero-skillset-cell__label {
      font-size: 13px;
      line-height: 1.3;
      font-weight: 600;
      color: inherit;
    }

    .hero-skillset-cell.is-empty .hero-skillset-cell__label {
      color: #9a9892;
      font-weight: 500;
    }

    .hero-skillset-card--view [data-info-type] {
      cursor: pointer;
    }

    .hero-skillset-info-popup {
      position: absolute;
      min-width: 240px;
      max-width: 280px;
      background: #fff;
      border: 1px solid #e2e1de;
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.16);
      padding: 16px;
      z-index: 100;
      display: none;
    }

    .hero-skillset-info-popup.is-visible {
      display: block;
    }

    .hero-skillset-info-popup__close {
      position: absolute;
      top: 6px;
      right: 8px;
      border: none;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      color: #6b6b67;
    }

    .hero-skillset-info-popup__title {
      font-size: 15px;
      font-weight: 600;
      margin: 0 24px 6px 0;
    }

    .hero-skillset-info-popup__description {
      font-size: 13px;
      color: #55534e;
      line-height: 1.4;
    }

    .hero-skillset-info-popup__link {
      display: inline-flex;
      margin-top: 10px;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #2383e2;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 720px) {
      .hero-skillset-card__row-content {
        flex-direction: column;
      }

      .hero-skillset-card__skills {
        grid-template-columns: repeat(2, minmax(120px, 1fr));
      }

      .hero-skillset-cell--hero {
        width: 100%;
        min-width: 0;
      }
    }

    .loading-spinner {
      margin: 120px auto;
      width: 48px;
      height: 48px;
      border: 4px solid #d3d2ce;
      border-top-color: #2383e2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.3);
      z-index: 80;
    }

    @media (max-width: 960px) {
      .view-app {
        display: block;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 260px;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.18);
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 90;
      }

      .view-app.sidebar-open .sidebar {
        transform: translateX(0);
      }

      .view-app.sidebar-closed .sidebar {
        transform: translateX(-100%);
      }

      .view-app.sidebar-closed {
        grid-template-columns: 0 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="view-app" id="viewApp">
    <aside class="sidebar" id="pageSidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">ページ一覧</div>
      </div>
      <ul class="sidebar-list" id="sidebarPageList"></ul>
      <div class="sidebar-footer">
        <div class="login-status" role="status" aria-live="polite">
          <div id="sidebarLoginStatusText" class="login-status-text">未ログイン</div>
          <div class="login-actions">
            <button id="sidebarLoginButton" class="btn btn-primary" type="button">ログイン</button>
            <button id="sidebarLogoutButton" class="btn" type="button" hidden>ログアウト</button>
          </div>
        </div>
      </div>
    </aside>
    <div class="view-main">
      <div class="view-container">
        <div class="view-header">
          <div class="header-left">
            <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="ページ一覧" aria-expanded="false">
              <span></span>
              <span></span>
              <span></span>
            </button>
            <nav class="breadcrumb" id="breadcrumb"></nav>
          </div>
          <button id="editPageButton" class="edit-button" type="button" disabled>編集</button>
        </div>
        <div id="loader" class="loading-spinner"></div>
        <section class="page-card hidden" id="pageCard">
          <h1 class="page-title" id="pageTitle"></h1>
          <div class="page-updated" id="pageUpdated"></div>
          <article class="page-content ProseMirror" id="pageContent"></article>
          <div class="status-message hidden" id="statusMessage"></div>
        </section>
      </div>
    </div>
  </div>
  <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

  <script type="module">
    import {
      loadHeroSkillsetData,
      normalizeHeroSkillsetConfig,
      encodeHeroSkillsetConfig,
      ROW_KEYS as HERO_SKILLSET_ROWS,
      USER_SKILL_KEYS as HERO_SKILLSET_USER_SLOTS
    } from './scripts/heroSkillsetService.js';
    const DEFAULT_TIMEOUT = 25000;
    const LOGIN_STORAGE_KEY = 'wikiLoginState';

    const APPS_SCRIPT_ENDPOINT_WIKI = window.APPS_SCRIPT_ENDPOINT_WIKI;

    const heroSkillsetInfoPopup = createHeroSkillsetInfoPopup();

    async function hydrateHeroSkillsetCards(root) {
      if (!root) {
        return;
      }
      const cards = Array.from(root.querySelectorAll('[data-hero-skillset-card]'));
      if (!cards.length) {
        return;
      }
      let data;
      try {
        data = await loadHeroSkillsetData();
      } catch (error) {
        console.error('英雄・スキルデータの読み込みに失敗しました。', error);
        return;
      }
      cards.forEach(card => {
        const config = normalizeHeroSkillsetConfig(card.getAttribute('data-config'));
        card.setAttribute('data-config', encodeHeroSkillsetConfig(config));
        renderHeroSkillsetCardView(card, config, data);
      });
    }

    function renderHeroSkillsetCardView(card, config, data) {
      card.classList.add('hero-skillset-card', 'hero-skillset-card--view');
      const body = document.createElement('div');
      body.className = 'hero-skillset-card__body';
      const grid = document.createElement('div');
      grid.className = 'hero-skillset-slot hero-skillset-card__grid';
      HERO_SKILLSET_ROWS.forEach(rowKey => {
        const rowWrapper = document.createElement('div');
        rowWrapper.className = 'hero-skillset-card__row';
        const content = document.createElement('div');
        content.className = 'hero-skillset-card__row-content';
        const rowData = config.rows?.[rowKey] || {};
        const heroId = rowData.heroId || null;
        const hero = heroId ? data.heroMap.get(heroId) : null;
        const heroSlot = createViewHeroSlot(hero);
        const skills = document.createElement('div');
        skills.className = 'hero-skillset-card__skills';
        const fixedSkillIds = hero?.fixedSkillIds || [];
        const slotMap = {
          skill1: fixedSkillIds[0] ? data.skillMap.get(fixedSkillIds[0]) : null,
          skill2: rowData.userSkills?.skill2 ? data.skillMap.get(rowData.userSkills.skill2) : null,
          skill3: rowData.userSkills?.skill3 ? data.skillMap.get(rowData.userSkills.skill3) : null,
          skill4: fixedSkillIds[1] ? data.skillMap.get(fixedSkillIds[1]) : null
        };
        Object.entries(slotMap).forEach(([slotKey, skill]) => {
          const slot = createViewSkillSlot(slotKey, skill);
          skills.appendChild(slot);
        });
        content.append(heroSlot, skills);
        rowWrapper.append(content);
        grid.appendChild(rowWrapper);
      });
      body.appendChild(grid);
      card.innerHTML = '';
      card.appendChild(body);
      if (card.__heroSkillsetInfoHandler) {
        card.removeEventListener('click', card.__heroSkillsetInfoHandler);
      }
      const handler = event => {
        const trigger = event.target.closest('[data-info-type]');
        if (!trigger) {
          return;
        }
        event.stopPropagation();
        const infoType = trigger.dataset.infoType;
        const infoId = trigger.dataset.infoId;
        if (!infoType || !infoId) {
          return;
        }
        const info = infoType === 'hero'
          ? data.heroMap.get(infoId)
          : data.skillMap.get(infoId);
        if (!info) {
          return;
        }
        heroSkillsetInfoPopup.show({
          anchor: trigger,
          titleText: info.name || '',
          descriptionText: info.description || '',
          url: info.url || ''
        });
      };
      card.addEventListener('click', handler);
      card.__heroSkillsetInfoHandler = handler;
    }

    function createViewHeroSlot(hero) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'hero-skillset-cell hero-skillset-cell--hero';
      const figure = createHeroSkillsetFigure(hero?.image, hero?.name, '+');
      const label = document.createElement('span');
      label.className = 'hero-skillset-cell__label';
      if (hero?.id) {
        label.textContent = hero.name;
        button.dataset.infoType = 'hero';
        button.dataset.infoId = hero.id;
      } else {
        label.textContent = '英雄未選択';
        button.classList.add('is-empty');
      }
      button.append(figure, label);
      return button;
    }

    function createViewSkillSlot(slotKey, skill) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'hero-skillset-cell hero-skillset-cell--skill';
      button.classList.add(
        slotKey === 'skill2' || slotKey === 'skill3'
          ? 'hero-skillset-cell--editable'
          : 'hero-skillset-cell--fixed'
      );
      const placeholder = slotKey === 'skill2' || slotKey === 'skill3' ? '+' : '—';
      const figure = createHeroSkillsetFigure(skill?.image, skill?.name, placeholder);
      const label = document.createElement('span');
      label.className = 'hero-skillset-cell__label';
      if (skill?.id) {
        label.textContent = skill.name;
        button.dataset.infoType = 'skill';
        button.dataset.infoId = skill.id;
      } else {
        label.textContent = slotKey === 'skill2' || slotKey === 'skill3' ? 'スキル未設定' : '英雄未選択';
        button.classList.add('is-empty');
      }
      button.append(figure, label);
      return button;
    }

    function createHeroSkillsetFigure(imageUrl, alt, placeholder) {
      const figure = document.createElement('div');
      figure.className = 'hero-skillset-cell__figure';
      if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = alt || '';
        figure.appendChild(img);
      } else {
        const span = document.createElement('span');
        span.className = 'hero-skillset-cell__placeholder';
        span.textContent = placeholder;
        figure.appendChild(span);
      }
      return figure;
    }

    function createHeroSkillsetInfoPopup() {
      const popup = document.createElement('div');
      popup.className = 'hero-skillset-info-popup';
      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'hero-skillset-info-popup__close';
      close.textContent = '×';
      const title = document.createElement('div');
      title.className = 'hero-skillset-info-popup__title';
      const description = document.createElement('div');
      description.className = 'hero-skillset-info-popup__description';
      const link = document.createElement('a');
      link.className = 'hero-skillset-info-popup__link';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = '説明ページを開く';
      popup.append(close, title, description, link);
      document.body.appendChild(popup);

      function hide() {
        popup.classList.remove('is-visible');
      }

      close.addEventListener('click', hide);
      document.addEventListener('click', event => {
        if (!popup.contains(event.target) && !event.target.closest('[data-info-type]')) {
          hide();
        }
      });
      window.addEventListener('scroll', hide, true);
      window.addEventListener('resize', hide);

      return {
        show({ anchor, titleText, descriptionText, url }) {
          title.textContent = titleText || '';
          description.textContent = descriptionText || '説明が登録されていません。';
          if (url) {
            link.href = url;
            link.hidden = false;
          } else {
            link.hidden = true;
            link.removeAttribute('href');
          }
          if (anchor) {
            const rect = anchor.getBoundingClientRect();
            popup.style.top = `${window.scrollY + rect.bottom + 8}px`;
            popup.style.left = `${window.scrollX + rect.left}px`;
          }
          popup.classList.add('is-visible');
        },
        hide
      };
    }

    function fetchWithoutPreflight(url, options = {}, timeout = DEFAULT_TIMEOUT) {
      return new Promise((resolve, reject) => {
        const controller = new AbortController();
        const timer = window.setTimeout(() => {
          controller.abort();
          reject(new Error(`Request timeout after ${timeout}ms`));
        }, timeout);

        const fetchOptions = {
          mode: 'cors',
          credentials: 'omit',
          ...options,
          headers: {
            'Content-Type': 'text/plain',
            ...(options.headers || {}),
          },
          signal: controller.signal,
        };

        fetch(url, fetchOptions)
          .then(response => {
            window.clearTimeout(timer);
            resolve(response);
          })
          .catch(error => {
            window.clearTimeout(timer);
            if (error.name === 'AbortError') {
              reject(new Error(`Request timeout after ${timeout}ms`));
            } else {
              reject(error);
            }
          });
      });
    }

    async function apiCall(action, data = {}) {
      const payload = { action, ...data };

      let response;
      try {
        response = await fetchWithoutPreflight(
          APPS_SCRIPT_ENDPOINT_WIKI,
          {
            method: 'POST',
            body: JSON.stringify(payload),
          }
        );
      } catch (error) {
        throw new Error(`Failed to reach Apps Script endpoint: ${error.message || error}`);
      }

      if (!response.ok) {
        const errorText = await response.text().catch(() => '');
        throw new Error(`HTTP ${response.status}: ${response.statusText}${errorText ? `\n${errorText}` : ''}`);
      }

      let result;
      try {
        result = await response.json();
      } catch (error) {
        throw new Error('Failed to parse JSON response from Apps Script');
      }

      if (!result?.success) {
        throw new Error(result?.message || 'Apps Script reported an error');
      }

      return result;
    }

    const pageCache = { value: null };

    const dataService = {
      async getPages() {
        if (Array.isArray(pageCache.value)) {
          return pageCache.value;
        }

        const response = await apiCall('getPages');
        const pages = response.pages || [];
        pageCache.value = pages;
        return pages;
      },
      async getPage(id) {
        if (!id) {
          throw new Error('Page ID is required');
        }
        const response = await apiCall('getPage', { id });
        if (!response.page) {
          throw new Error('Page not found');
        }
        return response.page;
      },
      getCachedPages() {
        return pageCache.value;
      },
    };

    const elements = {
      app: document.getElementById('viewApp'),
      loader: document.getElementById('loader'),
      card: document.getElementById('pageCard'),
      title: document.getElementById('pageTitle'),
      updated: document.getElementById('pageUpdated'),
      content: document.getElementById('pageContent'),
      breadcrumb: document.getElementById('breadcrumb'),
      status: document.getElementById('statusMessage'),
      editButton: document.getElementById('editPageButton'),
      sidebar: document.getElementById('pageSidebar'),
      sidebarList: document.getElementById('sidebarPageList'),
      sidebarToggle: document.getElementById('sidebarToggle'),
      sidebarOverlay: document.getElementById('sidebarOverlay'),
    };

    const loginElements = {
      statusText: document.getElementById('sidebarLoginStatusText'),
      loginButton: document.getElementById('sidebarLoginButton'),
      logoutButton: document.getElementById('sidebarLogoutButton'),
    };

    const normalizePageId = (pageId) => {
      const trimmed = (pageId || '').trim();
      return trimmed || 'top';
    };

    let currentPageId = getPageIdFromQuery();

    function getStoredLoginState() {
      try {
        const value = localStorage.getItem(LOGIN_STORAGE_KEY);
        return value ? JSON.parse(value) : null;
      } catch (error) {
        console.error('Failed to parse login state', error);
        return null;
      }
    }

    async function revokeAccessToken(token) {
      if (!token) {
        return;
      }
      try {
        await fetch('https://oauth2.googleapis.com/revoke', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: `token=${encodeURIComponent(token)}`,
        });
      } catch (error) {
        console.warn('Failed to revoke token', error);
      }
    }

    function buildLoginUrl(pageId) {
      const url = new URL('./login.html', window.location.href);
      url.searchParams.set('redirect', 'edit.html');
      if (pageId) {
        url.searchParams.set('page', pageId);
      }
      return url.toString();
    }

    function updateLoginRedirectTarget() {
      if (loginElements.loginButton) {
        loginElements.loginButton.dataset.pageId = currentPageId;
      }
    }

    function updateLoginUI() {
      const loginState = getStoredLoginState();
      if (loginElements.statusText) {
        if (loginState?.user?.name) {
          loginElements.statusText.textContent = `${loginState.user.name} としてログイン中`;
        } else {
          loginElements.statusText.textContent = '未ログイン';
        }
      }
      if (loginElements.loginButton) {
        const isLoggedIn = Boolean(loginState?.user?.name);
        loginElements.loginButton.hidden = isLoggedIn;
        loginElements.loginButton.disabled = false;
      }
      if (loginElements.logoutButton) {
        loginElements.logoutButton.hidden = !Boolean(loginState?.user?.name);
      }
      updateLoginRedirectTarget();
    }

    function handleLoginClick() {
      if (!loginElements.loginButton) {
        return;
      }
      const targetPage = loginElements.loginButton.dataset.pageId || currentPageId || 'top';
      window.location.href = buildLoginUrl(targetPage);
    }

    async function handleLogoutClick() {
      const loginState = getStoredLoginState();
      await revokeAccessToken(loginState?.accessToken);
      localStorage.removeItem(LOGIN_STORAGE_KEY);
      updateLoginUI();
    }

    loginElements.loginButton?.addEventListener('click', handleLoginClick);
    loginElements.logoutButton?.addEventListener('click', handleLogoutClick);

    window.addEventListener('storage', (event) => {
      if (event.key === LOGIN_STORAGE_KEY) {
        updateLoginUI();
      }
    });

    updateLoginUI();

    function getParentId(pageId) {
      if (!pageId || pageId === 'top') {
        return null;
      }
      const parts = pageId.split('/').filter(Boolean);
      if (parts.length <= 1) {
        return null;
      }
      parts.pop();
      return parts.join('/');
    }

    function getSlug(pageId) {
      if (!pageId) {
        return '';
      }
      const parts = pageId.split('/').filter(Boolean);
      return parts[parts.length - 1] || '';
    }

    function isDescendantId(targetId, ancestorId) {
      if (!targetId || !ancestorId || targetId === ancestorId) {
        return false;
      }
      return targetId.startsWith(`${ancestorId}/`);
    }

    function normalizeOrderValue(orderValue) {
      if (typeof orderValue === 'number' && Number.isFinite(orderValue)) {
        return orderValue;
      }
      if (typeof orderValue === 'string') {
        const trimmed = orderValue.trim();
        if (trimmed) {
          const numeric = Number(trimmed);
          if (Number.isFinite(numeric)) {
            return numeric;
          }
        }
      }
      return null;
    }

    function buildSidebarTree(pages) {
      const nodes = [];
      (pages || []).forEach((page, index) => {
        if (!page?.id) {
          return;
        }
        const normalizedId = normalizePageId(page.id);
        const parentId = getParentId(normalizedId);
        const parsedOrder = normalizeOrderValue(page.order);
        nodes.push({
          id: normalizedId,
          title: page.title || getSlug(normalizedId) || '無題',
          parentId: parentId ? normalizePageId(parentId) : null,
          order: parsedOrder !== null ? parsedOrder : index + 1,
          children: [],
        });
      });

      const map = new Map();
      nodes.forEach(node => map.set(node.id, node));

      const roots = [];
      nodes.forEach(node => {
        if (node.parentId && map.has(node.parentId)) {
          map.get(node.parentId).children.push(node);
        } else {
          node.parentId = null;
          roots.push(node);
        }
      });

      if (!map.has('top')) {
        const topChildren = [];
        const remainingRoots = [];
        roots.forEach(node => {
          if (node.id !== 'top' && node.id.startsWith('top/')) {
            node.parentId = 'top';
            topChildren.push(node);
          } else if (node.id !== 'top') {
            remainingRoots.push(node);
          }
        });
        const topNode = {
          id: 'top',
          title: 'top',
          parentId: null,
          order: Number.MIN_SAFE_INTEGER,
          children: topChildren,
        };
        map.set('top', topNode);
        roots.length = 0;
        roots.push(topNode, ...remainingRoots);
      } else {
        const topNode = map.get('top');
        if (topNode) {
          const topIndex = roots.indexOf(topNode);
          if (topIndex === -1) {
            roots.unshift(topNode);
          } else if (topIndex > 0) {
            roots.splice(0, 0, roots.splice(topIndex, 1)[0]);
          }
        }
      }

      const sortNodes = (list) => {
        list.sort((a, b) => {
          if (a.id === 'top') {
            return -1;
          }
          if (b.id === 'top') {
            return 1;
          }
          const orderA = Number.isFinite(a.order) ? a.order : Number.MAX_SAFE_INTEGER;
          const orderB = Number.isFinite(b.order) ? b.order : Number.MAX_SAFE_INTEGER;
          if (orderA !== orderB) {
            return orderA - orderB;
          }
          return (a.title || '').localeCompare(b.title || '', 'ja');
        });
        list.forEach(child => sortNodes(child.children));
      };

      sortNodes(roots);
      return roots;
    }

    function createSidebarNode(node, activePageId, level) {
      const li = document.createElement('li');
      li.className = 'sidebar-item';
      li.style.setProperty('--sidebar-indent-level', level);

      const link = document.createElement('a');
      link.className = 'sidebar-link';
      link.href = `./view.html?page=${encodeURIComponent(node.id)}`;
      link.dataset.pageId = node.id;
      link.textContent = node.title || node.id || '無題';

      if (node.id === activePageId) {
        li.classList.add('active');
        link.setAttribute('aria-current', 'page');
      } else if (isDescendantId(activePageId, node.id)) {
        li.classList.add('active-ancestor');
      }

      li.appendChild(link);

      if (Array.isArray(node.children) && node.children.length) {
        const childList = document.createElement('ul');
        childList.className = 'sidebar-sublist';
        node.children.forEach(child => {
          childList.appendChild(createSidebarNode(child, activePageId, level + 1));
        });
        li.appendChild(childList);
      }

      return li;
    }

    const SIDEBAR_BREAKPOINT = 960;
    const sidebarState = {
      open: window.innerWidth >= SIDEBAR_BREAKPOINT,
    };

    function isDesktop() {
      return window.innerWidth >= SIDEBAR_BREAKPOINT;
    }

    function setSidebar(open) {
      sidebarState.open = open;
      if (elements.app) {
        elements.app.classList.toggle('sidebar-open', open);
        elements.app.classList.toggle('sidebar-closed', !open);
      }

      if (elements.sidebarOverlay) {
        if (!isDesktop()) {
          elements.sidebarOverlay.classList.toggle('hidden', !open);
        } else {
          elements.sidebarOverlay.classList.add('hidden');
        }
      }

      if (elements.sidebarToggle) {
        elements.sidebarToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
    }

    function renderSidebarPages(pages, activePageId) {
      if (!elements.sidebarList) {
        return;
      }

      const normalizedActiveId = normalizePageId(activePageId);
      const tree = buildSidebarTree(pages);
      const fragment = document.createDocumentFragment();

      tree.forEach(node => {
        fragment.appendChild(createSidebarNode(node, normalizedActiveId, 0));
      });

      elements.sidebarList.innerHTML = '';
      elements.sidebarList.appendChild(fragment);
    }

    function getPageIdFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const value = (params.get('page') || '').trim();
      return normalizePageId(value);
    }

    function showStatus(message, isError = false) {
      if (!message) {
        elements.status.classList.add('hidden');
        elements.status.textContent = '';
        elements.status.classList.remove('error');
        return;
      }
      elements.status.textContent = message;
      elements.status.classList.toggle('error', isError);
      elements.status.classList.remove('hidden');
    }

    function renderBreadcrumb(pageId) {
      const parts = pageId.split('/').filter(Boolean);
      let pathAccumulator = '';
      elements.breadcrumb.innerHTML = '';

      if (!parts.length) {
        const span = document.createElement('span');
        span.textContent = 'top';
        elements.breadcrumb.appendChild(span);
        return;
      }

      parts.forEach((part, index) => {
        pathAccumulator = index === 0 ? part : `${pathAccumulator}/${part}`;
        if (index > 0) {
          const separator = document.createElement('span');
          separator.textContent = '›';
          elements.breadcrumb.appendChild(separator);
        }
        const link = document.createElement('a');
        link.href = `./view.html?page=${encodeURIComponent(pathAccumulator)}`;
        link.dataset.pageId = pathAccumulator;
        link.textContent = part;
        elements.breadcrumb.appendChild(link);
      });
    }

    async function displayPage(pageId) {
      const normalizedId = normalizePageId(pageId);
      currentPageId = normalizedId;
      heroSkillsetInfoPopup.hide();
      updateLoginRedirectTarget();
      renderBreadcrumb(normalizedId);
      renderSidebarPages(dataService.getCachedPages() || [], normalizedId);
      elements.editButton.dataset.pageId = normalizedId;
      elements.editButton.disabled = false;
      showStatus('');
      elements.loader.classList.remove('hidden');
      elements.card.classList.add('hidden');

      try {
        const [page, pages] = await Promise.all([
          dataService.getPage(normalizedId),
          dataService.getPages(),
        ]);

        document.title = `${page.title || normalizedId} | Wikiビュー`;
        elements.title.textContent = page.title || normalizedId;
        elements.updated.textContent = page.updatedAt
          ? `最終更新: ${new Date(page.updatedAt).toLocaleString('ja-JP')}`
          : '';
        elements.content.innerHTML = page.content || '';
        await hydrateHeroSkillsetCards(elements.content);
        renderSidebarPages(pages, normalizedId);
        showStatus('');
      } catch (error) {
        document.title = 'ページを表示できません';
        elements.title.textContent = 'ページを表示できません';
        elements.updated.textContent = '';
        elements.content.innerHTML = '';
        showStatus(error.message || 'ページの取得に失敗しました。', true);
        elements.editButton.disabled = true;
      } finally {
        elements.loader.classList.add('hidden');
        elements.card.classList.remove('hidden');
      }
    }

    function navigateTo(pageId, { replace = false } = {}) {
      const normalizedId = normalizePageId(pageId);
      const url = `?page=${encodeURIComponent(normalizedId)}`;

      if (replace) {
        history.replaceState({ pageId: normalizedId }, '', url);
      } else {
        history.pushState({ pageId: normalizedId }, '', url);
      }

      void displayPage(normalizedId);
    }

    setSidebar(sidebarState.open);

    if (elements.sidebarToggle) {
      elements.sidebarToggle.addEventListener('click', () => {
        setSidebar(!sidebarState.open);
      });
    }

    if (elements.sidebarOverlay) {
      elements.sidebarOverlay.addEventListener('click', () => {
        setSidebar(false);
      });
    }

    window.addEventListener('resize', () => {
      setSidebar(sidebarState.open);
    });

    document.addEventListener('click', (event) => {
      if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }

      const anchor = event.target.closest('a[data-page-id]');
      if (!anchor) {
        return;
      }

      event.preventDefault();
      navigateTo(anchor.dataset.pageId);

      if (anchor.closest('.sidebar') && !isDesktop()) {
        setSidebar(false);
      }
    });

    window.addEventListener('popstate', (event) => {
      const pageId = normalizePageId(event.state?.pageId || getPageIdFromQuery());
      void displayPage(pageId);
    });

    elements.editButton.addEventListener('click', () => {
      const pageId = elements.editButton.dataset.pageId;
      if (!pageId) {
        return;
      }
      const url = `./edit.html?page=${encodeURIComponent(pageId)}`;
      window.location.href = url;
    });

    navigateTo(getPageIdFromQuery(), { replace: true });
  </script>
</body>
</html>
