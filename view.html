<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wikiページ表示</title>
  <link rel="stylesheet" href="./styles/editor.css">
  <script src="./scripts/appsScriptEndpoints.js"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f5;
      color: #37352f;
    }

    .view-app {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
      background: inherit;
      transition: grid-template-columns 0.3s ease;
    }

    .view-app.sidebar-closed {
      grid-template-columns: 0 1fr;
    }

    .view-app.sidebar-closed .sidebar {
      opacity: 0;
      pointer-events: none;
    }

    .sidebar {
      background: #f7f6f3;
      border-right: 1px solid #e9e9e7;
      padding: 24px 0;
      transition: opacity 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 0 20px 20px;
      border-bottom: 1px solid #e9e9e7;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 24px 20px;
      border-top: 1px solid #e9e9e7;
      background: #f7f6f3;
    }

    .login-status {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
      color: #55534e;
    }

    .login-status-text {
      line-height: 1.4;
    }

    .login-actions {
      display: flex;
      gap: 8px;
    }

    .login-actions .btn {
      flex: 1;
    }

    .sidebar-list,
    .sidebar-sublist {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 0 24px;
    }

    .sidebar-item {
      padding: 0;
      margin: 2px 0;
    }

    .sidebar-link {
      display: block;
      text-decoration: none;
      color: inherit;
      font-size: 14px;
      padding: 6px 12px;
      padding-left: calc(12px + var(--sidebar-indent-level, 0) * 16px);
      border-radius: 6px;
      transition: background 0.1s ease;
      margin: 0 12px;
    }

    .sidebar-link:hover {
      background: #e9e9e7;
    }

    .sidebar-item.active > .sidebar-link {
      background: #2383e2;
      color: #fff;
    }

    .sidebar-item.active-ancestor > .sidebar-link {
      background: #e9e9e7;
      font-weight: 600;
    }

    .sidebar-sublist {
      margin-top: 4px;
    }

    .view-main {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .view-container {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px 80px;
      width: 100%;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    .sidebar-toggle {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #d3d2ce;
      background: #fff;
      cursor: pointer;
      transition: background 0.2s, border 0.2s;
    }

    .sidebar-toggle:hover {
      background: #f7f6f3;
    }

    .sidebar-toggle span {
      width: 18px;
      height: 2px;
      background: #37352f;
      border-radius: 99px;
    }

    .breadcrumb {
      font-size: 14px;
      color: #6b6b67;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 16px;
    }

    .edit-button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #d3d2ce;
      background: #fff;
      color: #37352f;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, border 0.2s;
    }

    .edit-button:hover {
      background: #f7f6f3;
    }

    .edit-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid #d3d2ce;
      background: #fff;
      color: #37352f;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      background: #f7f6f3;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #2383e2;
      border-color: #1d70c4;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1a6bc2;
    }

    .btn[hidden] {
      display: none !important;
    }

    .breadcrumb a {
      color: inherit;
      text-decoration: none;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .page-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      padding: 40px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 16px;
      line-height: 1.3;
    }

    .page-updated {
      font-size: 13px;
      color: #6b6b67;
      margin-bottom: 24px;
    }

    .page-content {
      font-size: 16px;
      line-height: 1.7;
    }

    .page-content img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .status-message {
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 8px;
      background: #fff8e6;
      border: 1px solid #f3d29b;
      color: #9b6b2f;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .status-message.error {
      background: #ffecec;
      border-color: #f2a7a7;
      color: #b14242;
    }

    .page-link-card {
      display: block;
      text-decoration: none;
      border: 1px solid #e2e1de;
      border-radius: 12px;
      padding: 14px 16px;
      background: #fdfdfc;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
      color: inherit;
      margin: 16px 0;
    }

    .page-link-card:hover {
      border-color: #d4d3cf;
    }

    .page-link-card__title {
      font-size: 16px;
      font-weight: 600;
      color: #2e2d2a;
      margin-bottom: 4px;
    }

    .page-link-card__meta {
      font-size: 12px;
      color: #6b6b67;
    }

    .loading-spinner {
      margin: 120px auto;
      width: 48px;
      height: 48px;
      border: 4px solid #d3d2ce;
      border-top-color: #2383e2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.3);
      z-index: 80;
    }

    @media (max-width: 960px) {
      .view-app {
        display: block;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 260px;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.18);
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 90;
      }

      .view-app.sidebar-open .sidebar {
        transform: translateX(0);
      }

      .view-app.sidebar-closed .sidebar {
        transform: translateX(-100%);
      }

      .view-app.sidebar-closed {
        grid-template-columns: 0 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="view-app" id="viewApp">
    <aside class="sidebar" id="pageSidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">ページ一覧</div>
      </div>
      <ul class="sidebar-list" id="sidebarPageList"></ul>
      <div class="sidebar-footer">
        <div class="login-status" role="status" aria-live="polite">
          <div id="sidebarLoginStatusText" class="login-status-text">未ログイン</div>
          <div class="login-actions">
            <button id="sidebarLoginButton" class="btn btn-primary" type="button">ログイン</button>
            <button id="sidebarLogoutButton" class="btn" type="button" hidden>ログアウト</button>
          </div>
        </div>
      </div>
    </aside>
    <div class="view-main">
      <div class="view-container">
        <div class="view-header">
          <div class="header-left">
            <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="ページ一覧" aria-expanded="false">
              <span></span>
              <span></span>
              <span></span>
            </button>
            <nav class="breadcrumb" id="breadcrumb"></nav>
          </div>
          <button id="editPageButton" class="edit-button" type="button" disabled>編集</button>
        </div>
        <div id="loader" class="loading-spinner"></div>
        <section class="page-card hidden" id="pageCard">
          <h1 class="page-title" id="pageTitle"></h1>
          <div class="page-updated" id="pageUpdated"></div>
          <article class="page-content ProseMirror" id="pageContent"></article>
          <div class="status-message hidden" id="statusMessage"></div>
        </section>
      </div>
    </div>
  </div>
  <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

  <script>
    const DEFAULT_TIMEOUT = 25000;
    const LOGIN_STORAGE_KEY = 'wikiLoginState';

    const APPS_SCRIPT_ENDPOINT_WIKI = window.APPS_SCRIPT_ENDPOINT_WIKI;

    function fetchWithoutPreflight(url, options = {}, timeout = DEFAULT_TIMEOUT) {
      return new Promise((resolve, reject) => {
        const controller = new AbortController();
        const timer = window.setTimeout(() => {
          controller.abort();
          reject(new Error(`Request timeout after ${timeout}ms`));
        }, timeout);

        const fetchOptions = {
          mode: 'cors',
          credentials: 'omit',
          ...options,
          headers: {
            'Content-Type': 'text/plain',
            ...(options.headers || {}),
          },
          signal: controller.signal,
        };

        fetch(url, fetchOptions)
          .then(response => {
            window.clearTimeout(timer);
            resolve(response);
          })
          .catch(error => {
            window.clearTimeout(timer);
            if (error.name === 'AbortError') {
              reject(new Error(`Request timeout after ${timeout}ms`));
            } else {
              reject(error);
            }
          });
      });
    }

    async function apiCall(action, data = {}) {
      const payload = { action, ...data };

      let response;
      try {
        response = await fetchWithoutPreflight(
          APPS_SCRIPT_ENDPOINT_WIKI,
          {
            method: 'POST',
            body: JSON.stringify(payload),
          }
        );
      } catch (error) {
        throw new Error(`Failed to reach Apps Script endpoint: ${error.message || error}`);
      }

      if (!response.ok) {
        const errorText = await response.text().catch(() => '');
        throw new Error(`HTTP ${response.status}: ${response.statusText}${errorText ? `\n${errorText}` : ''}`);
      }

      let result;
      try {
        result = await response.json();
      } catch (error) {
        throw new Error('Failed to parse JSON response from Apps Script');
      }

      if (!result?.success) {
        throw new Error(result?.message || 'Apps Script reported an error');
      }

      return result;
    }

    const pageCache = { value: null };

    const dataService = {
      async getPages() {
        if (Array.isArray(pageCache.value)) {
          return pageCache.value;
        }

        const response = await apiCall('getPages');
        const pages = response.pages || [];
        pageCache.value = pages;
        return pages;
      },
      async getPage(id) {
        if (!id) {
          throw new Error('Page ID is required');
        }
        const response = await apiCall('getPage', { id });
        if (!response.page) {
          throw new Error('Page not found');
        }
        return response.page;
      },
      getCachedPages() {
        return pageCache.value;
      },
    };

    const elements = {
      app: document.getElementById('viewApp'),
      loader: document.getElementById('loader'),
      card: document.getElementById('pageCard'),
      title: document.getElementById('pageTitle'),
      updated: document.getElementById('pageUpdated'),
      content: document.getElementById('pageContent'),
      breadcrumb: document.getElementById('breadcrumb'),
      status: document.getElementById('statusMessage'),
      editButton: document.getElementById('editPageButton'),
      sidebar: document.getElementById('pageSidebar'),
      sidebarList: document.getElementById('sidebarPageList'),
      sidebarToggle: document.getElementById('sidebarToggle'),
      sidebarOverlay: document.getElementById('sidebarOverlay'),
    };

    const loginElements = {
      statusText: document.getElementById('sidebarLoginStatusText'),
      loginButton: document.getElementById('sidebarLoginButton'),
      logoutButton: document.getElementById('sidebarLogoutButton'),
    };

    const normalizePageId = (pageId) => {
      const trimmed = (pageId || '').trim();
      return trimmed || 'top';
    };

    let currentPageId = getPageIdFromQuery();

    function getStoredLoginState() {
      try {
        const value = localStorage.getItem(LOGIN_STORAGE_KEY);
        return value ? JSON.parse(value) : null;
      } catch (error) {
        console.error('Failed to parse login state', error);
        return null;
      }
    }

    async function revokeAccessToken(token) {
      if (!token) {
        return;
      }
      try {
        await fetch('https://oauth2.googleapis.com/revoke', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: `token=${encodeURIComponent(token)}`,
        });
      } catch (error) {
        console.warn('Failed to revoke token', error);
      }
    }

    function buildLoginUrl(pageId) {
      const url = new URL('./login.html', window.location.href);
      url.searchParams.set('redirect', 'edit.html');
      if (pageId) {
        url.searchParams.set('page', pageId);
      }
      return url.toString();
    }

    function updateLoginRedirectTarget() {
      if (loginElements.loginButton) {
        loginElements.loginButton.dataset.pageId = currentPageId;
      }
    }

    function updateLoginUI() {
      const loginState = getStoredLoginState();
      if (loginElements.statusText) {
        if (loginState?.user?.name) {
          loginElements.statusText.textContent = `${loginState.user.name} としてログイン中`;
        } else {
          loginElements.statusText.textContent = '未ログイン';
        }
      }
      if (loginElements.loginButton) {
        const isLoggedIn = Boolean(loginState?.user?.name);
        loginElements.loginButton.hidden = isLoggedIn;
        loginElements.loginButton.disabled = false;
      }
      if (loginElements.logoutButton) {
        loginElements.logoutButton.hidden = !Boolean(loginState?.user?.name);
      }
      updateLoginRedirectTarget();
    }

    function handleLoginClick() {
      if (!loginElements.loginButton) {
        return;
      }
      const targetPage = loginElements.loginButton.dataset.pageId || currentPageId || 'top';
      window.location.href = buildLoginUrl(targetPage);
    }

    async function handleLogoutClick() {
      const loginState = getStoredLoginState();
      await revokeAccessToken(loginState?.accessToken);
      localStorage.removeItem(LOGIN_STORAGE_KEY);
      updateLoginUI();
    }

    loginElements.loginButton?.addEventListener('click', handleLoginClick);
    loginElements.logoutButton?.addEventListener('click', handleLogoutClick);

    window.addEventListener('storage', (event) => {
      if (event.key === LOGIN_STORAGE_KEY) {
        updateLoginUI();
      }
    });

    updateLoginUI();

    function getParentId(pageId) {
      if (!pageId || pageId === 'top') {
        return null;
      }
      const parts = pageId.split('/').filter(Boolean);
      if (parts.length <= 1) {
        return null;
      }
      parts.pop();
      return parts.join('/');
    }

    function getSlug(pageId) {
      if (!pageId) {
        return '';
      }
      const parts = pageId.split('/').filter(Boolean);
      return parts[parts.length - 1] || '';
    }

    function isDescendantId(targetId, ancestorId) {
      if (!targetId || !ancestorId || targetId === ancestorId) {
        return false;
      }
      return targetId.startsWith(`${ancestorId}/`);
    }

    function normalizeOrderValue(orderValue) {
      if (typeof orderValue === 'number' && Number.isFinite(orderValue)) {
        return orderValue;
      }
      if (typeof orderValue === 'string') {
        const trimmed = orderValue.trim();
        if (trimmed) {
          const numeric = Number(trimmed);
          if (Number.isFinite(numeric)) {
            return numeric;
          }
        }
      }
      return null;
    }

    function buildSidebarTree(pages) {
      const nodes = [];
      (pages || []).forEach((page, index) => {
        if (!page?.id) {
          return;
        }
        const normalizedId = normalizePageId(page.id);
        const parentId = getParentId(normalizedId);
        const parsedOrder = normalizeOrderValue(page.order);
        nodes.push({
          id: normalizedId,
          title: page.title || getSlug(normalizedId) || '無題',
          parentId: parentId ? normalizePageId(parentId) : null,
          order: parsedOrder !== null ? parsedOrder : index + 1,
          children: [],
        });
      });

      const map = new Map();
      nodes.forEach(node => map.set(node.id, node));

      const roots = [];
      nodes.forEach(node => {
        if (node.parentId && map.has(node.parentId)) {
          map.get(node.parentId).children.push(node);
        } else {
          node.parentId = null;
          roots.push(node);
        }
      });

      if (!map.has('top')) {
        const topChildren = [];
        const remainingRoots = [];
        roots.forEach(node => {
          if (node.id !== 'top' && node.id.startsWith('top/')) {
            node.parentId = 'top';
            topChildren.push(node);
          } else if (node.id !== 'top') {
            remainingRoots.push(node);
          }
        });
        const topNode = {
          id: 'top',
          title: 'top',
          parentId: null,
          order: Number.MIN_SAFE_INTEGER,
          children: topChildren,
        };
        map.set('top', topNode);
        roots.length = 0;
        roots.push(topNode, ...remainingRoots);
      } else {
        const topNode = map.get('top');
        if (topNode) {
          const topIndex = roots.indexOf(topNode);
          if (topIndex === -1) {
            roots.unshift(topNode);
          } else if (topIndex > 0) {
            roots.splice(0, 0, roots.splice(topIndex, 1)[0]);
          }
        }
      }

      const sortNodes = (list) => {
        list.sort((a, b) => {
          if (a.id === 'top') {
            return -1;
          }
          if (b.id === 'top') {
            return 1;
          }
          const orderA = Number.isFinite(a.order) ? a.order : Number.MAX_SAFE_INTEGER;
          const orderB = Number.isFinite(b.order) ? b.order : Number.MAX_SAFE_INTEGER;
          if (orderA !== orderB) {
            return orderA - orderB;
          }
          return (a.title || '').localeCompare(b.title || '', 'ja');
        });
        list.forEach(child => sortNodes(child.children));
      };

      sortNodes(roots);
      return roots;
    }

    function createSidebarNode(node, activePageId, level) {
      const li = document.createElement('li');
      li.className = 'sidebar-item';
      li.style.setProperty('--sidebar-indent-level', level);

      const link = document.createElement('a');
      link.className = 'sidebar-link';
      link.href = `./view.html?page=${encodeURIComponent(node.id)}`;
      link.dataset.pageId = node.id;
      link.textContent = node.title || node.id || '無題';

      if (node.id === activePageId) {
        li.classList.add('active');
        link.setAttribute('aria-current', 'page');
      } else if (isDescendantId(activePageId, node.id)) {
        li.classList.add('active-ancestor');
      }

      li.appendChild(link);

      if (Array.isArray(node.children) && node.children.length) {
        const childList = document.createElement('ul');
        childList.className = 'sidebar-sublist';
        node.children.forEach(child => {
          childList.appendChild(createSidebarNode(child, activePageId, level + 1));
        });
        li.appendChild(childList);
      }

      return li;
    }

    const SIDEBAR_BREAKPOINT = 960;
    const sidebarState = {
      open: window.innerWidth >= SIDEBAR_BREAKPOINT,
    };

    function isDesktop() {
      return window.innerWidth >= SIDEBAR_BREAKPOINT;
    }

    function setSidebar(open) {
      sidebarState.open = open;
      if (elements.app) {
        elements.app.classList.toggle('sidebar-open', open);
        elements.app.classList.toggle('sidebar-closed', !open);
      }

      if (elements.sidebarOverlay) {
        if (!isDesktop()) {
          elements.sidebarOverlay.classList.toggle('hidden', !open);
        } else {
          elements.sidebarOverlay.classList.add('hidden');
        }
      }

      if (elements.sidebarToggle) {
        elements.sidebarToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
    }

    function renderSidebarPages(pages, activePageId) {
      if (!elements.sidebarList) {
        return;
      }

      const normalizedActiveId = normalizePageId(activePageId);
      const tree = buildSidebarTree(pages);
      const fragment = document.createDocumentFragment();

      tree.forEach(node => {
        fragment.appendChild(createSidebarNode(node, normalizedActiveId, 0));
      });

      elements.sidebarList.innerHTML = '';
      elements.sidebarList.appendChild(fragment);
    }

    function getPageIdFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const value = (params.get('page') || '').trim();
      return normalizePageId(value);
    }

    function showStatus(message, isError = false) {
      if (!message) {
        elements.status.classList.add('hidden');
        elements.status.textContent = '';
        elements.status.classList.remove('error');
        return;
      }
      elements.status.textContent = message;
      elements.status.classList.toggle('error', isError);
      elements.status.classList.remove('hidden');
    }

    function renderBreadcrumb(pageId) {
      const parts = pageId.split('/').filter(Boolean);
      let pathAccumulator = '';
      elements.breadcrumb.innerHTML = '';

      if (!parts.length) {
        const span = document.createElement('span');
        span.textContent = 'top';
        elements.breadcrumb.appendChild(span);
        return;
      }

      parts.forEach((part, index) => {
        pathAccumulator = index === 0 ? part : `${pathAccumulator}/${part}`;
        if (index > 0) {
          const separator = document.createElement('span');
          separator.textContent = '›';
          elements.breadcrumb.appendChild(separator);
        }
        const link = document.createElement('a');
        link.href = `./view.html?page=${encodeURIComponent(pathAccumulator)}`;
        link.dataset.pageId = pathAccumulator;
        link.textContent = part;
        elements.breadcrumb.appendChild(link);
      });
    }

    async function displayPage(pageId) {
      const normalizedId = normalizePageId(pageId);
      currentPageId = normalizedId;
      updateLoginRedirectTarget();
      renderBreadcrumb(normalizedId);
      renderSidebarPages(dataService.getCachedPages() || [], normalizedId);
      elements.editButton.dataset.pageId = normalizedId;
      elements.editButton.disabled = false;
      showStatus('');
      elements.loader.classList.remove('hidden');
      elements.card.classList.add('hidden');

      try {
        const [page, pages] = await Promise.all([
          dataService.getPage(normalizedId),
          dataService.getPages(),
        ]);

        document.title = `${page.title || normalizedId} | Wikiビュー`;
        elements.title.textContent = page.title || normalizedId;
        elements.updated.textContent = page.updatedAt
          ? `最終更新: ${new Date(page.updatedAt).toLocaleString('ja-JP')}`
          : '';
        elements.content.innerHTML = page.content || '';
        renderSidebarPages(pages, normalizedId);
        showStatus('');
      } catch (error) {
        document.title = 'ページを表示できません';
        elements.title.textContent = 'ページを表示できません';
        elements.updated.textContent = '';
        elements.content.innerHTML = '';
        showStatus(error.message || 'ページの取得に失敗しました。', true);
        elements.editButton.disabled = true;
      } finally {
        elements.loader.classList.add('hidden');
        elements.card.classList.remove('hidden');
      }
    }

    function navigateTo(pageId, { replace = false } = {}) {
      const normalizedId = normalizePageId(pageId);
      const url = `?page=${encodeURIComponent(normalizedId)}`;

      if (replace) {
        history.replaceState({ pageId: normalizedId }, '', url);
      } else {
        history.pushState({ pageId: normalizedId }, '', url);
      }

      void displayPage(normalizedId);
    }

    setSidebar(sidebarState.open);

    if (elements.sidebarToggle) {
      elements.sidebarToggle.addEventListener('click', () => {
        setSidebar(!sidebarState.open);
      });
    }

    if (elements.sidebarOverlay) {
      elements.sidebarOverlay.addEventListener('click', () => {
        setSidebar(false);
      });
    }

    window.addEventListener('resize', () => {
      setSidebar(sidebarState.open);
    });

    document.addEventListener('click', (event) => {
      if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }

      const anchor = event.target.closest('a[data-page-id]');
      if (!anchor) {
        return;
      }

      event.preventDefault();
      navigateTo(anchor.dataset.pageId);

      if (anchor.closest('.sidebar') && !isDesktop()) {
        setSidebar(false);
      }
    });

    window.addEventListener('popstate', (event) => {
      const pageId = normalizePageId(event.state?.pageId || getPageIdFromQuery());
      void displayPage(pageId);
    });

    elements.editButton.addEventListener('click', () => {
      const pageId = elements.editButton.dataset.pageId;
      if (!pageId) {
        return;
      }
      const url = `./edit.html?page=${encodeURIComponent(pageId)}`;
      window.location.href = url;
    });

    navigateTo(getPageIdFromQuery(), { replace: true });
  </script>
</body>
</html>
