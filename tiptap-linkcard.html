<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Link Card Editor</title>
    <link rel="stylesheet" href="./styles/editor.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #f5f5f5;
            color: #2f2e2b;
        }

        .app-shell {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .editor-header {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .editor-title {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #1f2937;
        }

        .editor-description {
            margin: 0;
            font-size: 15px;
            color: #6b7280;
            line-height: 1.7;
        }

        .editor-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-button {
            border: 1px solid #d7d5d0;
            background: linear-gradient(145deg, #fdfdfa, #f2f1ed);
            color: #353432;
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: border 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .toolbar-button:hover {
            border-color: #c9c7c2;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
            transform: translateY(-1px);
        }

        .toolbar-button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .editor-container {
            background: #fff;
            border-radius: 18px;
            border: 1px solid #e4e3de;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
            padding: 32px 36px;
        }

        .editor-content {
            min-height: 420px;
        }

        .ProseMirror {
            outline: none;
            font-size: 16px;
            line-height: 1.75;
            color: #2f2e2b;
        }

        .ProseMirror p + .page-link-card,
        .ProseMirror .page-link-card + p,
        .ProseMirror .page-link-card + .page-link-card {
            margin-top: 20px;
        }

        .page-link-card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid #e1dfda;
            border-radius: 16px;
            padding: 16px 20px;
            background: linear-gradient(145deg, #fcfcfb, #f4f2ee);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease, background 0.2s ease;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
        }

        .page-link-card:hover {
            border-color: #d4d2cb;
            transform: translateY(-2px);
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.12);
            background: #ffffff;
        }

        .page-link-card::before {
            content: attr(data-page-initial);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #eef2ff, #e0e7ff);
            color: #3730a3;
            font-size: 18px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 0 0 1px rgba(55, 48, 163, 0.12);
        }

        .page-link-card__content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .page-link-card__title {
            font-size: 17px;
            font-weight: 600;
            color: #1f2937;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .page-link-card__meta {
            font-size: 12px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #6b7280;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .page-link-card[data-page-initial='📄']::before {
            font-size: 20px;
        }

        .page-link-panel {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.32);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 200;
        }

        .page-link-panel.visible {
            display: flex;
        }

        .page-link-panel__dialog {
            width: min(520px, calc(100vw - 48px));
            max-height: min(560px, calc(100vh - 96px));
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid rgba(15, 23, 42, 0.06);
            box-shadow: 0 32px 80px rgba(15, 23, 42, 0.24);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .page-link-panel__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px 16px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        }

        .page-link-panel__title {
            font-size: 18px;
            font-weight: 700;
            margin: 0;
        }

        .icon-button {
            border: none;
            background: none;
            color: #6b7280;
            font-size: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .icon-button:hover {
            color: #1f2937;
        }

        .page-link-panel__body {
            padding: 16px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 220px;
        }

        .page-link-panel__input {
            position: relative;
            display: flex;
            align-items: center;
        }

        .page-link-panel__input::before {
            content: '\\1F50D';
            position: absolute;
            left: 12px;
            font-size: 16px;
            color: #9ca3af;
        }

        .page-link-panel__input input {
            width: 100%;
            padding: 12px 14px 12px 38px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            outline: none;
            transition: border 0.2s ease, box-shadow 0.2s ease;
        }

        .page-link-panel__input input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .page-link-panel__status {
            font-size: 13px;
            color: #6b7280;
            display: none;
        }

        .page-link-panel__status.visible {
            display: block;
        }

        .page-link-panel__status.error {
            color: #b91c1c;
        }

        .page-link-panel__suggestions {
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            max-height: 280px;
        }

        .page-link-panel__suggestion {
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            transition: border 0.2s ease, background 0.2s ease, transform 0.15s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .page-link-panel__suggestion:hover,
        .page-link-panel__suggestion.active {
            background: #eff6ff;
            border-color: #bfdbfe;
            transform: translateY(-1px);
        }

        .page-link-panel__suggestion-title {
            font-size: 15px;
            font-weight: 600;
            color: #1f2937;
        }

        .page-link-panel__suggestion-id {
            font-size: 12px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #6b7280;
        }

        .page-link-panel__empty {
            padding: 18px 14px;
            border-radius: 12px;
            background: #f9fafb;
            color: #9ca3af;
            font-size: 14px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .app-shell {
                padding: 24px 16px 32px;
            }

            .editor-container {
                padding: 24px;
            }

            .page-link-card {
                padding: 14px 16px;
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="editor-header">
            <h1 class="editor-title">Wikiページのリンクカード</h1>
            <p class="editor-description">
                Wiki内のページ一覧をキャッシュし、検索候補から選択したページへのリンクカードを挿入できます。
                生成されたカードはNotion風の横長デザインで、クリックすると新しいタブで対象ページを開きます。
            </p>
            <div class="editor-toolbar">
                <button id="page-link-button" type="button" class="toolbar-button">🔗 ページリンクを挿入</button>
            </div>
        </header>
        <div class="editor-container">
            <div id="editor" class="editor-content"></div>
        </div>
    </div>

    <div id="page-link-panel" class="page-link-panel" aria-hidden="true">
        <div class="page-link-panel__dialog" role="dialog" aria-modal="true" aria-labelledby="page-link-panel-title">
            <div class="page-link-panel__header">
                <h2 id="page-link-panel-title" class="page-link-panel__title">リンク先ページを選択</h2>
                <button id="page-link-close" class="icon-button" type="button" aria-label="閉じる">×</button>
            </div>
            <div class="page-link-panel__body">
                <label class="page-link-panel__input">
                    <input id="page-link-input" type="text" placeholder="ページIDやタイトルで検索" autocomplete="off" spellcheck="false">
                </label>
                <div id="page-link-status" class="page-link-panel__status"></div>
                <ul id="page-link-suggestions" class="page-link-panel__suggestions" role="listbox" aria-label="ページ候補"></ul>
            </div>
        </div>
    </div>

    <script type="module">
        import { Editor } from 'https://esm.sh/@tiptap/core?bundle';
        import StarterKit from 'https://esm.sh/@tiptap/starter-kit?bundle';
        import Placeholder from 'https://esm.sh/@tiptap/extension-placeholder?bundle';
        import { PageLink } from './extensions/pageLink/PageLink.js';
        import { PageLinkAwareLink } from './extensions/pageLink/PageLinkAwareLink.js';
        import { PageLinkActions } from './extensions/pageLink/PageLinkActions.js';
        import { WikiDataService } from './scripts/wikiDataService.js';

        const PAGE_LIST_CACHE_KEY = 'wiki.pageListCache.v1';
        const PAGE_LIST_CACHE_MAX_ENTRIES = 2000;
        const SAMPLE_PAGES = [
            { id: 'guide/getting-started', title: 'ガイド: はじめに' },
            { id: 'team/meeting-notes', title: 'チームミーティングノート' },
            { id: 'project/wiki-roadmap', title: 'Wiki改善ロードマップ' },
            { id: 'handbook/development', title: '開発ハンドブック' },
            { id: 'memo/product-ideas', title: 'プロダクトアイデアメモ' },
        ];

        const state = {
            editor: null,
            cachedPages: [],
            pageLink: {
                open: false,
                query: '',
                suggestions: [],
                selectedIndex: -1,
            },
            isFetchingPages: false,
            lastFetchError: null,
            dataService: null,
        };

        const elements = {
            editor: document.getElementById('editor'),
            pageLinkButton: document.getElementById('page-link-button'),
            pageLinkPanel: document.getElementById('page-link-panel'),
            pageLinkClose: document.getElementById('page-link-close'),
            pageLinkInput: document.getElementById('page-link-input'),
            pageLinkSuggestions: document.getElementById('page-link-suggestions'),
            pageLinkStatus: document.getElementById('page-link-status'),
        };

        function normalizeCachedPages(pages) {
            if (!Array.isArray(pages)) {
                return [];
            }
            const map = new Map();
            for (const page of pages) {
                if (!page || !page.id) {
                    continue;
                }
                const id = String(page.id);
                const title = page.title ? String(page.title) : id.split('/').pop() || id;
                const description = page.description ? String(page.description) : null;
                map.set(id, { id, title, description });
                if (map.size >= PAGE_LIST_CACHE_MAX_ENTRIES) {
                    break;
                }
            }
            return Array.from(map.values());
        }

        function loadCachedPagesFromStorage() {
            if (typeof window === 'undefined' || !window.localStorage) {
                return;
            }
            try {
                const raw = window.localStorage.getItem(PAGE_LIST_CACHE_KEY);
                if (!raw) {
                    return;
                }
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed?.pages)) {
                    state.cachedPages = normalizeCachedPages(parsed.pages);
                }
            } catch (error) {
                console.warn('ページ一覧キャッシュの読み込みに失敗しました', error);
            }
        }

        function cachePageList(pages) {
            const normalized = normalizeCachedPages(pages);
            if (normalized.length) {
                state.cachedPages = normalized;
            }
            if (typeof window !== 'undefined' && window.localStorage) {
                try {
                    const payload = {
                        pages: normalized,
                        cachedAt: Date.now(),
                    };
                    window.localStorage.setItem(PAGE_LIST_CACHE_KEY, JSON.stringify(payload));
                } catch (error) {
                    console.warn('ページ一覧キャッシュの保存に失敗しました', error);
                }
            }
            if (state.pageLink.open) {
                updatePageLinkSuggestions();
            }
        }

        function ensureFallbackPages() {
            if (!state.cachedPages.length) {
                state.cachedPages = SAMPLE_PAGES.map(page => ({ ...page }));
            }
        }

        function createDataService() {
            const endpoint = (window.APP_ENDPOINTS?.wiki) || 'https://script.google.com/macros/s/AKfycbyFiFm2zdtkPhuZ4EOJ-yLEGnw_opM5hxQBb7EE-sSg2mJ9pOU3HTrFoAXgIeb5J2Q91w/exec';
            try {
                state.dataService = new WikiDataService({ endpoint });
            } catch (error) {
                console.warn('データサービスの初期化に失敗しました', error);
                state.dataService = null;
            }
        }

        async function refreshPageListFromServer() {
            if (!state.dataService) {
                ensureFallbackPages();
                return;
            }
            state.isFetchingPages = true;
            updatePageLinkStatus();
            try {
                const pages = await state.dataService.getPages();
                cachePageList(pages);
                state.lastFetchError = null;
            } catch (error) {
                console.error('ページ一覧の取得に失敗しました', error);
                state.lastFetchError = error;
                if (!state.cachedPages.length) {
                    ensureFallbackPages();
                }
            } finally {
                state.isFetchingPages = false;
                updatePageLinkStatus();
            }
        }

        function updatePageLinkStatus() {
            if (!elements.pageLinkStatus) {
                return;
            }
            const { isFetchingPages, lastFetchError, cachedPages } = state;
            if (isFetchingPages) {
                elements.pageLinkStatus.textContent = 'ページ一覧を読み込み中です…';
                elements.pageLinkStatus.classList.add('visible');
                elements.pageLinkStatus.classList.remove('error');
                return;
            }
            if (lastFetchError) {
                elements.pageLinkStatus.textContent = 'ページ一覧の取得に失敗しました。後でもう一度お試しください。';
                elements.pageLinkStatus.classList.add('visible', 'error');
                return;
            }
            if (!cachedPages.length) {
                elements.pageLinkStatus.textContent = 'ページがまだ登録されていません。';
                elements.pageLinkStatus.classList.add('visible');
                elements.pageLinkStatus.classList.remove('error');
                return;
            }
            elements.pageLinkStatus.textContent = '';
            elements.pageLinkStatus.classList.remove('visible', 'error');
        }

        function filterPageSuggestions(query) {
            const needle = (query || '').trim().toLowerCase();
            let matches = state.cachedPages || [];
            if (needle) {
                matches = matches.filter(page => {
                    const idMatch = page.id?.toLowerCase().includes(needle);
                    const titleMatch = page.title?.toLowerCase().includes(needle);
                    return idMatch || titleMatch;
                });
            }
            return matches.slice(0, 50);
        }

        function updatePageLinkSuggestions() {
            state.pageLink.suggestions = filterPageSuggestions(state.pageLink.query);
            state.pageLink.selectedIndex = state.pageLink.suggestions.length ? 0 : -1;
            renderPageLinkSuggestions();
        }

        function renderPageLinkSuggestions() {
            if (!elements.pageLinkSuggestions) {
                return;
            }
            elements.pageLinkSuggestions.innerHTML = '';
            const suggestions = state.pageLink.suggestions;
            if (!suggestions.length) {
                const empty = document.createElement('li');
                empty.className = 'page-link-panel__empty';
                empty.textContent = state.cachedPages.length
                    ? '一致するページがありません'
                    : 'ページ一覧がまだ読み込まれていません';
                elements.pageLinkSuggestions.appendChild(empty);
                return;
            }
            suggestions.forEach((page, index) => {
                const item = document.createElement('li');
                item.className = 'page-link-panel__suggestion';
                item.dataset.index = String(index);
                item.setAttribute('role', 'option');
                const title = document.createElement('div');
                title.className = 'page-link-panel__suggestion-title';
                title.textContent = page.title || page.id;
                const id = document.createElement('div');
                id.className = 'page-link-panel__suggestion-id';
                id.textContent = page.id;
                item.appendChild(title);
                item.appendChild(id);
                if (index === state.pageLink.selectedIndex) {
                    item.classList.add('active');
                    item.setAttribute('aria-selected', 'true');
                }
                item.addEventListener('mousedown', event => {
                    event.preventDefault();
                });
                item.addEventListener('click', () => {
                    selectPageSuggestion(index);
                });
                elements.pageLinkSuggestions.appendChild(item);
            });
        }

        function showPageLinkPanel() {
            if (!elements.pageLinkPanel || !elements.pageLinkInput) {
                return;
            }
            state.pageLink.open = true;
            state.pageLink.query = '';
            elements.pageLinkInput.value = '';
            elements.pageLinkPanel.classList.add('visible');
            elements.pageLinkPanel.setAttribute('aria-hidden', 'false');
            updatePageLinkStatus();
            updatePageLinkSuggestions();
            requestAnimationFrame(() => {
                elements.pageLinkInput?.focus();
                elements.pageLinkInput?.select();
            });
        }

        function hidePageLinkPanel({ focusEditor = false } = {}) {
            if (!elements.pageLinkPanel || !state.pageLink.open) {
                return;
            }
            state.pageLink.open = false;
            state.pageLink.query = '';
            state.pageLink.suggestions = [];
            state.pageLink.selectedIndex = -1;
            elements.pageLinkPanel.classList.remove('visible');
            elements.pageLinkPanel.setAttribute('aria-hidden', 'true');
            elements.pageLinkSuggestions.innerHTML = '';
            if (focusEditor) {
                state.editor?.commands.focus();
            }
        }

        function moveSuggestionSelection(offset) {
            if (!state.pageLink.suggestions.length) {
                return;
            }
            const count = state.pageLink.suggestions.length;
            const current = state.pageLink.selectedIndex >= 0 ? state.pageLink.selectedIndex : 0;
            let next = (current + offset) % count;
            if (next < 0) {
                next += count;
            }
            state.pageLink.selectedIndex = next;
            renderPageLinkSuggestions();
            const active = elements.pageLinkSuggestions?.querySelector('.page-link-panel__suggestion.active');
            active?.scrollIntoView({ block: 'nearest' });
        }

        function selectPageSuggestion(index) {
            if (index < 0 || index >= state.pageLink.suggestions.length) {
                return;
            }
            const page = state.pageLink.suggestions[index];
            if (!page) {
                return;
            }
            const url = `./view.html?page=${encodeURIComponent(page.id)}`;
            const attrs = {
                pageId: page.id,
                title: page.title || page.id,
                url,
                description: page.description || page.id,
            };
            const inserted = state.editor?.commands.insertPageLinkFromSuggestion(attrs);
            if (inserted) {
                hidePageLinkPanel({ focusEditor: true });
            }
        }

        function handlePanelKeydown(event) {
            if (!state.pageLink.open) {
                return;
            }
            if (event.key === 'ArrowDown') {
                event.preventDefault();
                moveSuggestionSelection(1);
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                moveSuggestionSelection(-1);
            } else if (event.key === 'Enter') {
                event.preventDefault();
                const index = state.pageLink.selectedIndex >= 0 ? state.pageLink.selectedIndex : 0;
                selectPageSuggestion(index);
            } else if (event.key === 'Escape') {
                event.preventDefault();
                hidePageLinkPanel({ focusEditor: true });
            }
        }

        function handleOutsideClick(event) {
            if (!state.pageLink.open || !elements.pageLinkPanel) {
                return;
            }
            if (event.target === elements.pageLinkPanel) {
                hidePageLinkPanel({ focusEditor: true });
            }
        }

        function bindEvents() {
            elements.pageLinkButton?.addEventListener('click', () => {
                if (state.pageLink.open) {
                    state.editor?.commands.hidePageLinkPanel();
                } else {
                    state.editor?.commands.showPageLinkPanel();
                }
            });

            elements.pageLinkClose?.addEventListener('click', () => {
                state.editor?.commands.hidePageLinkPanel();
            });

            elements.pageLinkPanel?.addEventListener('click', handleOutsideClick);

            elements.pageLinkInput?.addEventListener('input', event => {
                state.pageLink.query = event.target.value;
                updatePageLinkSuggestions();
            });

            elements.pageLinkInput?.addEventListener('keydown', handlePanelKeydown);

            document.addEventListener('keydown', event => {
                if (!state.pageLink.open) {
                    return;
                }
                if (event.key === 'Escape') {
                    hidePageLinkPanel({ focusEditor: true });
                }
            });
        }

        function createEditor() {
            if (!elements.editor) {
                throw new Error('Editor container is missing');
            }
            const initialContent = `
                <h2>ページリンクカードのサンプル</h2>
                <p>ツールバーの「ページリンクを挿入」ボタンを押して、Wiki内のページを検索できます。</p>
                <a class="page-link-card" data-page-link-card data-page-id="guide/getting-started" data-page-title="ガイド: はじめに" data-page-initial="ガ" href="./view.html?page=guide%2Fgetting-started" target="_blank" rel="noopener noreferrer">
                    <div class="page-link-card__content">
                        <div class="page-link-card__title">ガイド: はじめに</div>
                        <div class="page-link-card__meta">guide/getting-started</div>
                    </div>
                </a>
                <p>カード全体がリンクになっており、新しいタブで開きます。</p>
            `;

            state.editor = new Editor({
                element: elements.editor,
                content: initialContent,
                extensions: [
                    StarterKit.configure({
                        history: true,
                    }),
                    Placeholder.configure({
                        placeholder: 'ここにテキストを入力…',
                    }),
                    PageLink,
                    PageLinkAwareLink.configure({
                        openOnClick: false,
                    }),
                    PageLinkActions.configure({
                        onShowPanel: showPageLinkPanel,
                        onHidePanel: () => hidePageLinkPanel({ focusEditor: true }),
                        onInsert: (attrs, editor) => {
                            if (!attrs || !attrs.pageId) {
                                return false;
                            }
                            editor.chain()
                                .focus()
                                .insertPageLinkCard({
                                    pageId: attrs.pageId,
                                    title: attrs.title || attrs.pageId,
                                    url: attrs.url || `./view.html?page=${encodeURIComponent(attrs.pageId)}`,
                                    description: attrs.description || attrs.pageId,
                                })
                                .run();
                            return true;
                        },
                    }),
                ],
            });
        }

        function init() {
            createDataService();
            loadCachedPagesFromStorage();
            ensureFallbackPages();
            createEditor();
            bindEvents();
            if (state.cachedPages.length) {
                updatePageLinkSuggestions();
            }
            refreshPageListFromServer();
        }

        init();
    </script>
</body>
</html>
