<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>英雄スキル構成 UI プロトタイプ</title>
<style>
body {
    font-family: sans-serif;
    background:#1b1f2a;
    color:white;
    margin:30px;
}

/* --- カード枠 --- */
.card {
    background:#2b3040;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
    width: fit-content;
}

/* スロット配置 */
.wrapper {
    display:flex;
    align-items:center;
    gap:20px;
}

/* 英雄スロット（サイズそのまま） */
.hero-slot {
    width:90px;
    height:90px;
    border:2px dashed #888;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#2a2f3d;
    cursor:pointer;
}
.hero-slot img {
    width:100%;
    height:100%;
    border-radius:10px;
}

/* ⭐ スキルスロット（50%に縮小） */
.skill-slot {
    width:45px !important;
    height:45px !important;
    border:2px dashed #888;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#2a2f3d;
    cursor:pointer;
}
.skill-slot img {
    width:100%;
    height:100%;
    border-radius:6px;
}

/* ＋ボタン */
.plus {
    font-size:22px;
    opacity:0.4;
}

#editToggle {
    position:fixed;
    top:20px;
    right:20px;
    padding:10px 20px;
    background:#3c6;
    border:none;
    font-size:18px;
    cursor:pointer;
}

/* --- スキル説明ポップアップ --- */
.skill-popup {
    position:absolute;
    background:white;
    color:black;
    border:1px solid #999;
    padding:10px;
    border-radius:10px;
    display:none;
    z-index:1000;
    width:260px;
    box-shadow:0 0 5px rgba(0,0,0,0.4);
}
.skill-popup-close {
    position:absolute;
    top:4px;
    right:4px;
    background:#ccc;
    color:black;
    font-weight:bold;
    width:20px;
    height:20px;
    line-height:18px;
    text-align:center;
    cursor:pointer;
    border-radius:3px;
}
.skill-popup button {
    margin-top:10px;
    width:100%;
}

/* 選択ポップアップ */
.popup-bg {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
}
.popup {
    background:#fff;
    color:#000;
    padding:20px;
    width:350px;
    max-height:70vh;
    overflow:auto;
    border-radius:10px;
}
.icon-list {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}
.icon-list img {
    width:70px;
    height:70px;
    border-radius:10px;
    cursor:pointer;
    border:2px solid transparent;
}
.icon-list img:hover {
    border-color:#3c6;
}
</style>
</head>
<body>

<button id="editToggle">編集</button>

<h2>英雄スキル構成プロトタイプ</h2>

<!-- ⭐ カードで全体を囲む -->
<div class="card">
    <div class="wrapper">
        <div id="heroSlot" class="hero-slot" data-type="hero">
            <span class="plus">+</span>
        </div>

        <!-- スキルスロットは50% サイズ -->
        <div id="skill1" class="skill-slot fixed-skill"></div>
        <div id="skill2" class="skill-slot editable"><span class="plus">+</span></div>
        <div id="skill3" class="skill-slot editable"><span class="plus">+</span></div>
        <div id="skill4" class="skill-slot fixed-skill"></div>
    </div>
</div>

<!-- スキル説明ポップアップ -->
<div id="skillPopup" class="skill-popup">
    <div class="skill-popup-close" onclick="skillPopup.style.display='none'">×</div>
    <div id="skillDesc"></div>
    <button id="openDetail">詳細表示</button>
</div>

<!-- 英雄/スキル選択ポップアップ -->
<div id="selectPopup" class="popup-bg">
    <div class="popup">
        <h2 id="popupTitle"></h2>
        <div class="icon-list" id="popupList"></div>
    </div>
</div>

<script>
// ---------------------------------------------------------
// JSON（サンプルデータ）
// ---------------------------------------------------------
const heroes = [
    { id:1, name:"Hero-A", icon:"img/heroA.png",
      skills:[
        { id:"h1", icon:"img/skillA1.png", desc:"Hero A Skill 1 説明", url:"https://example.com" },
        { id:"h2", icon:"img/skillA2.png", desc:"Hero A Skill 2 説明", url:"https://example.com" },
        { id:"h3", icon:"img/skillA3.png", desc:"Hero A Skill 3 説明", url:"https://example.com" },
      ]
    },
    { id:2, name:"Hero-B", icon:"img/heroB.png",
      skills:[
        { id:"h4", icon:"img/skillB1.png", desc:"Hero B Skill 1 説明", url:"https://example.com" },
        { id:"h5", icon:"img/skillB2.png", desc:"Hero B Skill 2 説明", url:"https://example.com" },
        { id:"h6", icon:"img/skillB3.png", desc:"Hero B Skill 3 説明", url:"https://example.com" },
      ]
    }
];

const allSkills = [
    { id:"s1", icon:"img/skill1.png", desc:"スキル1 説明", url:"https://example.com/skill1" },
    { id:"s2", icon:"img/skill2.png", desc:"スキル2 説明", url:"https://example.com/skill2" },
    { id:"s3", icon:"img/skill3.png", desc:"スキル3 説明", url:"https://example.com/skill3" },
];

let selectedHero = null;
let selectedSkills = { skill2:null, skill3:null };
let editing = false;

const heroSlot = document.getElementById("heroSlot");
const slots = {
    skill1: document.getElementById("skill1"),
    skill2: document.getElementById("skill2"),
    skill3: document.getElementById("skill3"),
    skill4: document.getElementById("skill4"),
};

const popupBG = document.getElementById("selectPopup");
const popupList = document.getElementById("popupList");
const popupTitle = document.getElementById("popupTitle");

const skillPopup = document.getElementById("skillPopup");
const skillDesc = document.getElementById("skillDesc");
const openDetail = document.getElementById("openDetail");


// ---------------------------------------------------------
// 編集/決定
// ---------------------------------------------------------
document.getElementById("editToggle").onclick = ()=>{
    editing = !editing;
    document.getElementById("editToggle").textContent = editing ? "決定" : "編集";
};


// ---------------------------------------------------------
// スキルアイコンクリック → 説明ポップアップ
// ---------------------------------------------------------
document.querySelectorAll(".skill-slot, .hero-slot").forEach(slot => {
    slot.addEventListener("click", (e) => {

        if (editing) return;

        e.stopPropagation();

        const desc = slot.dataset.desc;
        const url  = slot.dataset.url;

        if (!desc) return;

        skillDesc.textContent = desc;
        openDetail.onclick = () => window.open(url, "_blank");

        const rect = slot.getBoundingClientRect();
        skillPopup.style.left = rect.left + "px";
        skillPopup.style.top  = rect.bottom + "px";
        skillPopup.style.display = "block";
    });
});

// ポップアップ内部クリック → 閉じない
skillPopup.addEventListener("click", (e) => {
    e.stopPropagation();
});

// ポップアップ外クリック → 閉じる
document.addEventListener("click", (e) => {
    if (skillPopup.style.display === "block" && !skillPopup.contains(e.target)) {
        skillPopup.style.display = "none";
    }
});



// ---------------------------------------------------------
// 英雄・スキル選択処理
// ---------------------------------------------------------
function openPopup(title, list, targetSlot){
    popupTitle.textContent = title;
    popupList.innerHTML = "";

    list.forEach(item => {

        // ★ 他のスロットで選択されているスキルを排除
        const alreadySelected = Object.keys(selectedSkills)
            .filter(k => k !== targetSlot)           // 自分以外の slot
            .map(k => selectedSkills[k]?.id)
            .includes(item.id);

        if (alreadySelected) return;  // 表示しない（選択不可）

        const img = document.createElement("img");
        img.src = item.icon;
        img.onclick = () => selectItem(targetSlot, item);
        popupList.appendChild(img);
    });

    popupBG.style.display="flex";
}


popupBG.addEventListener("click", (e)=>{
    if (e.target === popupBG) popupBG.style.display="none";
});


function selectItem(slotId, item){
    popupBG.style.display="none";

    // 英雄選択
    if (slotId === "hero") {
        selectedHero = item;

        heroSlot.innerHTML = `<img src="${item.icon}">`;

        const fixed1 = item.skills[0];
        const fixed4 = item.skills[2];

        slots.skill1.innerHTML = `<img src="${fixed1.icon}">`;
        slots.skill1.dataset.desc = fixed1.desc;
        slots.skill1.dataset.url  = fixed1.url;

        slots.skill4.innerHTML = `<img src="${fixed4.icon}">`;
        slots.skill4.dataset.desc = fixed4.desc;
        slots.skill4.dataset.url  = fixed4.url;

        return;
    }

    // 任意スキル
    selectedSkills[slotId] = item;
    const slot = slots[slotId];

    slot.innerHTML = `<img src="${item.icon}">`;
    slot.dataset.desc = item.desc;
    slot.dataset.url  = item.url;
}


// ---------------------------------------------------------
// 編集モード時のスロットクリック
// ---------------------------------------------------------
document.querySelectorAll(".hero-slot, .skill-slot").forEach(slot=>{
    slot.addEventListener("click", ()=>{
        if (!editing) return;

        if (slot.classList.contains("hero-slot")) {
            openPopup("英雄選択", heroes, "hero");
        } else if (slot.classList.contains("editable")) {
            openPopup("スキル選択", allSkills, slot.id);
        }
    });
});
</script>
</body>
</html>
