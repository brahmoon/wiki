<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>英雄スキル構成 UI プロトタイプ</title>
<style>
body {
    font-family: sans-serif;
    background:#1b1f2a;
    color:white;
    margin:30px;
}

/* --- カード --- */
.card {
    background:#2b3040;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
    width: fit-content;
}

/* 行（1行が1人の英雄＋スキルセット） */
.row {
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:10px;
}

/* --- 英雄スロット --- */
.hero-slot {
    width:60px;
    height:60px;
    border:2px dashed #888;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#2a2f3d;
    cursor:pointer;
    position:relative;
}
.hero-slot img {
    width:60px !important;    /* ←★ 60px表示 */
    height:60px !important;
    border-radius:10px;
}

/* スキルスロット（50%サイズ） */
.skill-slot {
    width:45px;
    height:45px;
    border:2px dashed #888;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#2a2f3d;
    cursor:pointer;
    position:relative;
}
.skill-slot img {
    width:100%;
    height:100%;
    border-radius:6px;
}

/* ＋ボタン */
.plus {
    font-size:22px;
    opacity:0.4;
    pointer-events:none;
}

/* ボタン */
#editToggle {
    position:fixed;
    top:20px;
    right:20px;
    padding:10px 20px;
    background:#3c6;
    border:none;
    font-size:18px;
    cursor:pointer;
}

/* --- 情報ポップアップ（英雄＆スキル共通） --- */
.info-popup {
    position:absolute;
    background:white;
    color:black;
    border:1px solid #999;
    padding:10px;
    border-radius:10px;
    display:none;
    z-index:1000;
    width:260px;
    box-shadow:0 0 5px rgba(0,0,0,0.4);
}
.info-popup-close {
    position:absolute;
    top:4px;
    right:4px;
    background:#ccc;
    color:black;
    font-weight:bold;
    width:20px;
    height:20px;
    line-height:18px;
    text-align:center;
    cursor:pointer;
    border-radius:3px;
}
.info-popup button {
    margin-top:10px;
    width:100%;
}

/* --- 選択ポップアップ --- */
.popup-bg {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
}
.popup {
    background:#fff;
    color:#000;
    padding:20px;
    width:350px;
    max-height:70vh;
    overflow:auto;
    border-radius:10px;
}
.popup h2 { margin-top:0; }
.icon-list {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}
.icon-list img {
    width:70px;
    height:70px;
    border-radius:10px;
    cursor:pointer;
    border:2px solid transparent;
}
.icon-list img:hover {
    border-color:#3c6;
}

/* --- 斜線アイコン --- */
.empty-img {
    width:70%;
    height:70%;
    opacity:0.7;
}

/* ←★ padding 削除済み */
.empty-list-icon {
    width:70px;
    height:70px;
    background:white;
    border:2px solid #555;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>
<body>

<button id="editToggle">編集</button>

<h2>英雄スキル構成プロトタイプ（2人分）</h2>

<div class="card">

    <!-- 1人目 -->
    <div class="row">
        <div id="hero_row1" class="hero-slot" data-row="row1">
            <span class="plus">+</span>
        </div>
        <div id="row1_skill1" class="skill-slot fixed-skill"></div>
        <div id="row1_skill2" class="skill-slot editable"><span class="plus">+</span></div>
        <div id="row1_skill3" class="skill-slot editable"><span class="plus">+</span></div>
        <div id="row1_skill4" class="skill-slot fixed-skill"></div>
    </div>

    <!-- 2人目 -->
    <div class="row">
        <div id="hero_row2" class="hero-slot" data-row="row2">
            <span class="plus">+</span>
        </div>
        <div id="row2_skill1" class="skill-slot fixed-skill"></div>
        <div id="row2_skill2" class="skill-slot editable"><span class="plus">+</span></div>
        <div id="row2_skill3" class="skill-slot editable"><span class="plus">+</span></div>
        <div id="row2_skill4" class="skill-slot fixed-skill"></div>
    </div>

</div>


<!-- 英雄/スキル説明ポップアップ -->
<div id="infoPopup" class="info-popup">
    <div class="info-popup-close" onclick="infoPopup.style.display='none'">×</div>
    <div id="infoContent"></div>
    <button id="openDetail">詳細表示</button>
</div>


<!-- 選択ポップアップ -->
<div id="selectPopup" class="popup-bg">
    <div class="popup">
        <h2 id="popupTitle"></h2>
        <div class="icon-list" id="popupList"></div>
    </div>
</div>


<script>
// ---------------------------------------------------------
// 斜線 SVG（決定状態で使う）
// ---------------------------------------------------------
const EMPTY_ICON_SRC =
  "data:image/svg+xml;utf8," +
  encodeURIComponent(`
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
      <rect width='64' height='64' fill='none'/>
      <line x1='8' y1='56' x2='56' y2='8'
        stroke='#666' stroke-width='2' stroke-linecap='round'/>
    </svg>
  `);

// ---------------------------------------------------------
// JSON データ
// ---------------------------------------------------------
const heroes = [
    {
        id:1, name:"Hero-A", icon:"img/heroA.png",
        desc:"Hero A の説明テキストです。",
        url:"#",
        skills:[
            { id:"h1", name:"HeroA Skill1", icon:"img/skillA1.png", desc:"Hero A Skill 1 説明", url:"#"},
            { id:"h2", name:"HeroA Skill2", icon:"img/skillA2.png", desc:"Hero A Skill 2 説明", url:"#"},
            { id:"h3", name:"HeroA Skill3", icon:"img/skillA3.png", desc:"Hero A Skill 3 説明", url:"#"}
        ]
    },
    {
        id:2, name:"Hero-B", icon:"img/heroB.png",
        desc:"Hero B の説明テキストです。",
        url:"#",
        skills:[
            { id:"h4", name:"HeroB Skill1", icon:"img/skillB1.png", desc:"Hero B Skill 1 説明", url:"#"},
            { id:"h5", name:"HeroB Skill2", icon:"img/skillB2.png", desc:"Hero B Skill 2 説明", url:"#"},
            { id:"h6", name:"HeroB Skill3", icon:"img/skillB3.png", desc:"Hero B Skill 3 説明", url:"#"}
        ]
    }
];

const allSkills = [
    { id:"s1", name:"汎用スキル1", icon:"img/skill1.png", desc:"スキル1 説明", url:"#"},
    { id:"s2", name:"汎用スキル2", icon:"img/skill2.png", desc:"スキル2 説明", url:"#"},
    { id:"s3", name:"汎用スキル3", icon:"img/skill3.png", desc:"スキル3 説明", url:"#"}
];


// ---------------------------------------------------------
// 状態管理
// ---------------------------------------------------------
let editing = false;

const selectedHeroes = { row1:null, row2:null };

const selectedUserSkills = {
    "row1_skill2":null,
    "row1_skill3":null,
    "row2_skill2":null,
    "row2_skill3":null
};


// ---------------------------------------------------------
// DOM 取得
// ---------------------------------------------------------
const heroSlots = {
    row1: document.getElementById("hero_row1"),
    row2: document.getElementById("hero_row2")
};

const skillSlots = {
    row1: {
        skill1: document.getElementById("row1_skill1"),
        skill2: document.getElementById("row1_skill2"),
        skill3: document.getElementById("row1_skill3"),
        skill4: document.getElementById("row1_skill4")
    },
    row2: {
        skill1: document.getElementById("row2_skill1"),
        skill2: document.getElementById("row2_skill2"),
        skill3: document.getElementById("row2_skill3"),
        skill4: document.getElementById("row2_skill4")
    }
};

const popupBG   = document.getElementById("selectPopup");
const popupList = document.getElementById("popupList");
const popupTitle= document.getElementById("popupTitle");

const infoPopup  = document.getElementById("infoPopup");
const infoContent= document.getElementById("infoContent");
const openDetail = document.getElementById("openDetail");


// ---------------------------------------------------------
// スロット表示更新（決定→斜線 / 編集→＋）
// ---------------------------------------------------------
function updateSlotVisualState() {
    document.querySelectorAll(".hero-slot, .skill-slot").forEach(slot => {

        const isHero    = slot.classList.contains("hero-slot");
        const isEditable= slot.classList.contains("editable");

        const plusEl = slot.querySelector(".plus");
        const realImg = slot.querySelector("img:not([data-empty='true'])");
        const emptyImg = slot.querySelector("img[data-empty='true']");

        // 編集モード
        if (editing) {
            slot.style.borderStyle = "dashed";

            // 斜線は消す
            if (emptyImg) emptyImg.remove();

            if (!realImg && (isHero || isEditable)) {
                if (plusEl) plusEl.style.display = "block";
            } else {
                if (plusEl) plusEl.style.display = "none";
            }
            return;
        }

        // 決定モード
        slot.style.borderStyle = "solid";
        if (plusEl) plusEl.style.display = "none";

        if (!realImg) {
            // 空スロット → 斜線アイコン
            if (!emptyImg) {
                const img = document.createElement("img");
                img.src = EMPTY_ICON_SRC;
                img.className = "empty-img";
                img.dataset.empty = "true";
                slot.appendChild(img);
            }
        } else {
            if (emptyImg) emptyImg.remove();
        }
    });
}

// 初期反映
updateSlotVisualState();


// ---------------------------------------------------------
// 編集 / 決定 トグル
// ---------------------------------------------------------
document.getElementById("editToggle").onclick = () => {
    editing = !editing;
    document.getElementById("editToggle").textContent =
        editing ? "決定" : "編集";

    if (!editing) {
        console.log("保存された構成:", {
            heroes:selectedHeroes,
            skills:selectedUserSkills
        });
    }

    updateSlotVisualState();
};


// ---------------------------------------------------------
// スロットクリック（編集時→選択 / 決定時→説明）
// ---------------------------------------------------------
document.querySelectorAll(".hero-slot, .skill-slot").forEach(slot => {
    slot.addEventListener("click", (e) => {

        if (editing) {
            e.stopPropagation();

            if (slot.classList.contains("hero-slot")) {
                openHeroSelectPopup(slot.dataset.row);
            }
            else if (slot.classList.contains("editable")) {
                openSkillSelectPopup(slot.id);
            }
            return;
        }

        // 閲覧モード：説明表示
        const desc = slot.dataset.desc;
        const url = slot.dataset.url;
        const name = slot.dataset.name;
        if (!desc) return;

        e.stopPropagation();

        infoContent.innerHTML = `<strong>${name}</strong><br>${desc}`;
        openDetail.onclick = () => url ? window.open(url,"_blank") : null;

        const rect = slot.getBoundingClientRect();
        infoPopup.style.left = rect.left+"px";
        infoPopup.style.top  = rect.bottom+"px";
        infoPopup.style.display = "block";
    });
});

// 説明ポップアップ内クリックで閉じない
infoPopup.addEventListener("click", e=>e.stopPropagation());

// 外側クリックで閉じる
document.addEventListener("click", e=>{
    if(infoPopup.style.display==="block" && !infoPopup.contains(e.target)){
        infoPopup.style.display="none";
    }
});


// ---------------------------------------------------------
// 英雄選択ポップアップ
// ---------------------------------------------------------
function openHeroSelectPopup(row) {
    popupTitle.textContent = "英雄選択";
    popupList.innerHTML = "";

    // 他行の英雄ID
    const otherRow = row === "row1" ? "row2":"row1";
    const otherHeroId = selectedHeroes[otherRow]?.id || null;

    // ★ その行に既に英雄が入っていれば解除アイコンを表示
    if (selectedHeroes[row]) {
        const clear = document.createElement("img");
        clear.src = EMPTY_ICON_SRC;
        clear.className = "empty-list-icon";
        clear.title = "選択解除";
        clear.onclick = () => {
            clearHero(row);
            popupBG.style.display = "none";
        };
        popupList.appendChild(clear);
    }

    heroes.forEach(hero => {
        if (hero.id === otherHeroId) return;

        const img = document.createElement("img");
        img.src = hero.icon;
        img.title = hero.name;
        img.onclick = () => selectHero(row,hero);
        popupList.appendChild(img);
    });

    popupBG.style.display = "flex";
}


// ---------------------------------------------------------
// 英雄確定
// ---------------------------------------------------------
function selectHero(row, hero) {
    popupBG.style.display = "none";
    selectedHeroes[row] = hero;

    const slot = heroSlots[row];

    slot.innerHTML = `<img src="${hero.icon}" title="${hero.name}">`;
    slot.dataset.desc = hero.desc;
    slot.dataset.url  = hero.url;
    slot.dataset.name = hero.name;

    // 固定スキル
    const f1 = hero.skills[0];
    const f4 = hero.skills[2];

    const slot1 = skillSlots[row].skill1;
    slot1.innerHTML = `<img src="${f1.icon}" title="${f1.name}">`;
    slot1.dataset.desc = f1.desc;
    slot1.dataset.url = f1.url;
    slot1.dataset.name= f1.name;

    const slot4 = skillSlots[row].skill4;
    slot4.innerHTML = `<img src="${f4.icon}" title="${f4.name}">`;
    slot4.dataset.desc = f4.desc;
    slot4.dataset.url  = f4.url;
    slot4.dataset.name = f4.name;

    updateSlotVisualState();
}


// ---------------------------------------------------------
// 英雄解除（＋表示状態に戻す）
// ---------------------------------------------------------
function clearHero(row) {
    selectedHeroes[row] = null;

    const heroSlot = heroSlots[row];
    heroSlot.innerHTML = `<span class="plus">+</span>`;
    delete heroSlot.dataset.desc;
    delete heroSlot.dataset.url;
    delete heroSlot.dataset.name;

    // 固定スキル2個も初期化
    const s1 = skillSlots[row].skill1;
    const s4 = skillSlots[row].skill4;

    [s1,s4].forEach(s=>{
        s.innerHTML = "";
        delete s.dataset.desc;
        delete s.dataset.url;
        delete s.dataset.name;
    });

    updateSlotVisualState();
}


// ---------------------------------------------------------
// スキル選択ポップアップ
// ---------------------------------------------------------
function openSkillSelectPopup(slotId) {
    popupTitle.textContent = "スキル選択";
    popupList.innerHTML = "";

    // 他の3スロットで使ってるスキルを除外
    const usedIds = Object.entries(selectedUserSkills)
      .filter(([id,val])=>id!==slotId && val)
      .map(([id,val])=>val.id);

    // ★ 現スロットにスキルが入っているときだけ解除アイコン
    if (selectedUserSkills[slotId]) {
        const clear = document.createElement("img");
        clear.src = EMPTY_ICON_SRC;
        clear.className = "empty-list-icon";
        clear.title = "選択解除";
        clear.onclick = () => {
            clearUserSkill(slotId);
            popupBG.style.display = "none";
        };
        popupList.appendChild(clear);
    }

    allSkills.forEach(skill => {
        if (usedIds.includes(skill.id)) return;

        const img = document.createElement("img");
        img.src = skill.icon;
        img.title = skill.name;
        img.onclick = () => selectUserSkill(slotId,skill);
        popupList.appendChild(img);
    });

    popupBG.style.display = "flex";
}


// ---------------------------------------------------------
// スキル確定
// ---------------------------------------------------------
function selectUserSkill(slotId, skill) {
    popupBG.style.display = "none";
    selectedUserSkills[slotId] = skill;

    const slot = document.getElementById(slotId);
    slot.innerHTML = `<img src="${skill.icon}" title="${skill.name}">`;
    slot.dataset.desc = skill.desc;
    slot.dataset.url  = skill.url;
    slot.dataset.name = skill.name;

    updateSlotVisualState();
}


// ---------------------------------------------------------
// スキル解除（＋表示に戻す）
// ---------------------------------------------------------
function clearUserSkill(slotId) {
    selectedUserSkills[slotId] = null;

    const slot = document.getElementById(slotId);
    slot.innerHTML = `<span class="plus">+</span>`;
    delete slot.dataset.desc;
    delete slot.dataset.url;
    delete slot.dataset.name;

    updateSlotVisualState();
}


// ---------------------------------------------------------
// ポップアップ背景クリックで閉じる
// ---------------------------------------------------------
popupBG.addEventListener("click", e=>{
    if(e.target===popupBG) popupBG.style.display="none";
});

</script>
</body>
</html>
