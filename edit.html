<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki with TipTap</title>
    <link rel="stylesheet" href="./styles/editor.css">
    <script src="./scripts/appsScriptEndpoints.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #f5f5f5;
            color: #37352f;
        }

        .app-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
            width: 100vw;
            transition: grid-template-columns 0.3s ease;
        }

        .app-container.sidebar-closed {
            grid-template-columns: 0 1fr;
        }

        .app-container.sidebar-closed .sidebar {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar {
            width: 280px;
            background: #f7f6f3;
            border-right: 1px solid #e9e9e7;
            display: flex;
            flex-direction: column;
            transition: opacity 0.2s ease;
        }

        .sidebar-header {
            padding: 20px 24px 12px;
            border-bottom: 1px solid #e9e9e7;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
        }

        .sidebar-actions {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            border-bottom: 1px solid #e9e9e7;
        }

        .sidebar-actions .btn {
            flex: 1;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 16px 24px 20px;
            border-top: 1px solid #e9e9e7;
            background: #f7f6f3;
        }

        .login-status {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 13px;
            color: #55534e;
        }

        .login-status-text {
            line-height: 1.4;
        }

        .login-actions {
            display: flex;
            gap: 8px;
        }

        .page-tree {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px 24px 16px;
        }

        .tree-list,
        .tree-list ul {
            list-style: none;
            margin: 0;
            padding-left: 16px;
        }

        .tree-list > li {
            padding-left: 0;
        }

        .tree-item {
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #37352f;
            position: relative;
        }

        .tree-item:hover {
            background: #e9e9e7;
        }

        .tree-item.active {
            background: #2383e2;
            color: #fff;
        }

        .tree-item.dragging {
            opacity: 0.5;
        }

        .tree-item.drop-target,
        .tree-list.drop-target,
        .tree-children.drop-target {
            outline: 2px dashed #2383e2;
            outline-offset: 2px;
        }

        .tree-item.drop-before {
            box-shadow: inset 0 3px 0 #2383e2;
        }

        .tree-item.drop-after {
            box-shadow: inset 0 -3px 0 #2383e2;
        }

        .tree-item.drop-inside {
            outline: 2px dashed #2383e2;
            outline-offset: 2px;
        }

        .tree-drop-zone {
            position: relative;
            height: 8px;
            margin: 2px 0;
            border-radius: 999px;
            list-style: none;
        }

        .tree-drop-zone::after {
            content: '';
            position: absolute;
            left: 8px;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 2px dashed transparent;
        }

        .tree-drop-zone.active::after {
            border-color: #2383e2;
        }

        .tree-children {
            margin-left: 12px;
            border-left: 1px solid #e0dfdc;
            padding-left: 12px;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 100vh;
        }

        .page-header {
            padding: 16px 32px 0;
            border-bottom: 1px solid #e9e9e7;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 30;
        }

        .page-header-top {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-header.is-scrolled {
            box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
            border-bottom-color: transparent;
        }

        .page-header-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .page-meta {
            display: flex;
            gap: 16px;
            align-items: flex-end;
        }

        .page-meta-fields {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-meta-toggle {
            display: none;
        }

        .page-meta-toggle-icon {
            position: relative;
            width: 28px;
            height: 12px;
        }

        .page-meta-toggle-icon::before,
        .page-meta-toggle-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 12px;
            height: 2px;
            background: #4a4a48;
            border-radius: 999px;
            transition: transform 0.2s ease;
        }

        .page-meta-toggle-icon::before {
            left: 3px;
            transform-origin: left center;
            transform: translateY(-50%) rotate(35deg);
        }

        .page-meta-toggle-icon::after {
            right: 3px;
            transform-origin: right center;
            transform: translateY(-50%) rotate(-35deg);
        }

        .page-meta-toggle.is-open .page-meta-toggle-icon::before {
            transform: translateY(-50%) rotate(-35deg);
        }

        .page-meta-toggle.is-open .page-meta-toggle-icon::after {
            transform: translateY(-50%) rotate(35deg);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 200px;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: #6b6b67;
        }

        .text-input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #d3d2ce;
            font-size: 14px;
            font-family: inherit;
        }

        .text-input:disabled {
            background: #f1f1ef;
            color: #9b9a97;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #d3d2ce;
            background: #fff;
            color: #37352f;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
        }

        .btn:hover {
            background: #f7f6f3;
        }

        .btn-primary {
            background: #2383e2;
            border-color: #2383e2;
            color: #fff;
        }

        .btn-primary:hover {
            background: #1a6bc2;
        }

        .btn-secondary {
            background: #f0f0ef;
            border-color: #d3d2ce;
            color: #37352f;
        }

        .btn-secondary:hover {
            background: #e4e4e2;
        }

        .editor-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            background: #f8f8f7;
            --page-header-height: 0px;
            scroll-padding-top: calc(var(--page-header-height, 0px) + 16px);
        }

        .editor-container {
            max-width: 860px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .youtube-paste-popup {
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            flex-direction: column;
            gap: 12px;
            padding: 14px 16px;
            background: #fff;
            border: 1px solid #d3d2ce;
            border-radius: 10px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18);
            z-index: 40;
            min-width: 240px;
        }

        .youtube-paste-popup.visible {
            display: flex;
        }

        .youtube-paste-popup-message {
            font-size: 13px;
            color: #37352f;
            line-height: 1.5;
        }

        .youtube-paste-popup-actions {
            display: flex;
            gap: 10px;
        }

        .youtube-paste-popup-actions .btn {
            flex: 1;
            white-space: nowrap;
        }

        .youtube-embed {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 0;
            border-radius: 12px;
            background: #000;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(55, 53, 47, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }

        .loading-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .loading-popup {
            background: #fff;
            padding: 28px 36px;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            min-width: 260px;
        }

        .loading-spinner {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 4px solid #e9e9e7;
            border-top-color: #2383e2;
            animation: loading-spin 1s linear infinite;
        }

        @keyframes loading-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-message {
            font-size: 15px;
            color: #37352f;
            font-weight: 500;
            text-align: center;
        }

        .editor-image {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        .resizable-image {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        .resizable-image img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .resizable-image.is-selected img {
            outline: 2px solid rgba(35, 131, 226, 0.5);
            outline-offset: 2px;
        }

        .resize-handle {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2383e2;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            touch-action: none;
            z-index: 5;
        }

        .resizable-image.is-selected .resize-handle {
            opacity: 1;
            pointer-events: auto;
        }

        .resize-handle-n { top: 0; left: 50%; transform: translate(-50%, -50%); cursor: ns-resize; }
        .resize-handle-s { bottom: 0; left: 50%; transform: translate(-50%, 50%); cursor: ns-resize; }
        .resize-handle-e { top: 50%; right: 0; transform: translate(50%, -50%); cursor: ew-resize; }
        .resize-handle-w { top: 50%; left: 0; transform: translate(-50%, -50%); cursor: ew-resize; }
        .resize-handle-ne { top: 0; right: 0; transform: translate(50%, -50%); cursor: nesw-resize; }
        .resize-handle-nw { top: 0; left: 0; transform: translate(-50%, -50%); cursor: nwse-resize; }
        .resize-handle-se { bottom: 0; right: 0; transform: translate(50%, 50%); cursor: nwse-resize; }
        .resize-handle-sw { bottom: 0; left: 0; transform: translate(-50%, 50%); cursor: nesw-resize; }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 12px 32px;
            margin: 0 -32px;
            border-top: 1px solid #edeceb;
            background: #f9f9f8;
        }

        .toolbar button {
            border: 1px solid transparent;
            background: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 15px;
            cursor: pointer;
            color: #494848;
        }

        .toolbar button:hover {
            background: #ececec;
            border-color: #d0d0ce;
        }

        .toolbar button.active {
            background: #2383e2;
            color: #fff;
            border-color: #2383e2;
        }

        .page-link-panel {
            position: absolute;
            top: 16px;
            right: 16px;
            left: auto;
            z-index: 40;
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            width: min(360px, calc(100vw - 64px));
            border-radius: 12px;
            border: 1px solid #dfdeda;
            box-shadow: 0 18px 36px rgba(15, 23, 42, 0.18);
            background: #fff;
        }

        .page-link-panel.visible {
            display: flex;
        }

        .page-link-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d0d0ce;
            font-size: 14px;
            font-family: inherit;
        }

        .page-link-input:focus {
            border-color: #2383e2;
            box-shadow: 0 0 0 3px rgba(35, 131, 226, 0.15);
            outline: none;
        }

        .page-link-suggestions {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 260px;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #e6e5e2;
        }

        .page-link-suggestion {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            background: #fff;
        }

        .page-link-suggestion + .page-link-suggestion {
            border-top: 1px solid #f0efed;
        }

        .page-link-suggestion__title {
            font-size: 14px;
            font-weight: 600;
            color: #2e2d2a;
        }

        .page-link-suggestion__id {
            font-size: 12px;
            color: #6b6b67;
        }

        .page-link-suggestion.is-active,
        .page-link-suggestion:hover {
            background: #f0f6ff;
        }

        .page-link-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .page-link-actions button {
            border: 1px solid #d0d0ce;
            background: #fafafa;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            color: #494848;
        }

        .page-link-actions button:hover {
            background: #ececec;
            border-color: #c0c0bd;
        }

        .page-link-card {
            display: block;
            text-decoration: none;
            border: 1px solid #e2e1de;
            border-radius: 12px;
            padding: 14px 16px;
            background: #fdfdfc;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
            color: inherit;
            margin: 16px 0;
        }

        .page-link-card:hover {
            border-color: #d4d3cf;
        }

        .page-link-card__title {
            font-size: 16px;
            font-weight: 600;
            color: #2e2d2a;
            margin-bottom: 4px;
        }

        .page-link-card__meta {
            font-size: 12px;
            color: #6b6b67;
        }

        .link-editor-bar {
            display: none;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid #edeceb;
            background: #fff;
            align-items: center;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 25;
        }

        .link-editor-bar.visible {
            display: flex;
        }

        .link-editor-bar.stuck {
            box-shadow: 0 6px 12px rgba(15, 23, 42, 0.12);
        }

        .link-editor-input {
            flex: 1;
            min-width: 200px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #d0d0ce;
            font-size: 14px;
            font-family: inherit;
        }

        .link-editor-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .link-editor-bar button {
            border: 1px solid #d0d0ce;
            background: #fafafa;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            color: #494848;
            transition: background 0.2s, border 0.2s, color 0.2s;
        }

        .link-editor-bar button:hover {
            background: #ececec;
            border-color: #c0c0bd;
        }

        .link-target-toggle[aria-pressed="true"] {
            background: #2383e2;
            color: #fff;
            border-color: #2383e2;
        }

        .editor-content {
            padding: 24px 32px 48px;
        }

        .ProseMirror {
            min-height: 400px;
            outline: none;
        }

        .ProseMirror p.is-editor-empty:first-child::before {
            content: attr(data-placeholder);
            float: left;
            color: #adb5bd;
            pointer-events: none;
            height: 0;
        }

        .status-bar {
            padding: 10px 24px;
            font-size: 13px;
            border-top: 1px solid #e9e9e7;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .status-message {
            color: #6b6b67;
        }

        .status-message.status-success {
            color: #2f8f2f;
        }

        .status-message.status-error {
            color: #c0352b;
        }

        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .settings-overlay.visible {
            display: flex;
        }

        .settings-dialog {
            width: min(420px, 90vw);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 24px 64px rgba(15, 23, 42, 0.25);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .settings-dialog h2 {
            margin: 0;
            font-size: 20px;
        }

        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .settings-field label {
            font-size: 13px;
            font-weight: 600;
            color: #55534e;
        }

        .settings-field input,
        .settings-field select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #d3d2ce;
            font-size: 14px;
            font-family: inherit;
        }

        .settings-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 4px;
        }

        .settings-message {
            font-size: 13px;
            min-height: 18px;
            color: #6b6b67;
        }

        .settings-message.error {
            color: #c0352b;
        }

        .settings-message.success {
            color: #0f7b6c;
        }

        .sidebar-toggle {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid #d3d2ce;
            background: #fff;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
        }

        .sidebar-toggle:hover {
            background: #f7f6f3;
        }

        .sidebar-toggle span {
            width: 18px;
            height: 2px;
            background: #37352f;
            border-radius: 99px;
        }

        .hidden {
            display: none !important;
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.3);
            z-index: 80;
        }

        .breadcrumb {
            font-size: 12px;
            color: #9b9a97;
        }

        .breadcrumb span + span::before {
            content: ' / ';
            color: #c6c5c1;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #9b9a97;
        }

        @media (max-width: 960px) {
            .app-container {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 260px;
                box-shadow: 0 10px 40px rgba(15, 23, 42, 0.18);
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                z-index: 90;
            }

            .app-container.sidebar-open .sidebar {
                transform: translateX(0);
            }

            .app-container.sidebar-closed .sidebar {
                transform: translateX(-100%);
            }
        }

        @media (max-width: 600px) {
            .page-header-row {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .page-meta {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }

            .page-meta-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                background: #e4e4e4;
                border: none;
                border-radius: 10px;
                padding: 12px 16px;
                cursor: pointer;
                transition: background 0.2s ease;
                position: relative;
            }

            .page-meta-toggle.is-open {
                background: #d6d6d6;
            }

            .page-meta-toggle:focus-visible {
                outline: 2px solid #2383e2;
                outline-offset: 2px;
            }

            .page-meta-toggle-icon {
                margin: 0 auto;
            }

            .page-meta-fields {
                flex-direction: column;
                gap: 12px;
                background: #fff;
                border-radius: 10px;
                border: 1px solid #d3d2ce;
                padding: 16px;
            }

            .page-meta-fields[hidden] {
                display: none;
            }

            .header-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <aside class="sidebar" id="pageSidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">ページ一覧</div>
            </div>
            <div class="sidebar-actions">
                <button id="create-root-page" class="btn">新規ページ</button>
                <button id="reload-pages" class="btn">再読み込み</button>
            </div>
            <div id="page-tree" class="page-tree"></div>
            <div class="sidebar-footer">
                <div class="login-status" role="status" aria-live="polite">
                    <div id="login-status-text" class="login-status-text">未ログイン</div>
                    <div class="login-actions">

    <div id="user-settings-overlay" class="settings-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="settings-dialog" role="document">
            <h2>ユーザー設定</h2>
            <form id="user-settings-form" class="settings-form">
                <div class="settings-field">
                    <label for="settings-username">ユーザーネーム</label>
                    <input id="settings-username" name="username" type="text" autocomplete="name" required />
                </div>
                <div class="settings-field">
                    <label for="settings-kingdom">所属王国</label>
                    <input id="settings-kingdom" name="kingdom" type="number" inputmode="numeric" pattern="\\d*" min="0" step="1" placeholder="0" />
                </div>
                <div class="settings-field">
                    <label for="settings-language">言語</label>
                    <select id="settings-language" name="language">
                        <option value="ja">日本語</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div id="user-settings-message" class="settings-message" aria-live="polite"></div>
                <div class="settings-actions">
                    <button id="user-settings-cancel" class="btn" type="button">キャンセル</button>
                    <button id="user-settings-submit" class="btn btn-primary" type="submit">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { Editor, Node, mergeAttributes } from 'https://esm.sh/@tiptap/core';
        import { StarterKit } from 'https://esm.sh/@tiptap/starter-kit';
        import { Link } from 'https://esm.sh/@tiptap/extension-link';
        import { Placeholder } from 'https://esm.sh/@tiptap/extension-placeholder';
        import { Table } from 'https://esm.sh/@tiptap/extension-table';
        import { TableRow } from 'https://esm.sh/@tiptap/extension-table-row';
        import { TableCell } from 'https://esm.sh/@tiptap/extension-table-cell';
        import { TableHeader } from 'https://esm.sh/@tiptap/extension-table-header';
        import { NodeSelection } from 'https://esm.sh/@tiptap/pm/state';
        import { ResizableImage } from 'https://brahmoon.github.io/wiki/extensions/resizableImage/ResizableImage.js';
        import { DriveImageExtension } from 'https://brahmoon.github.io/wiki/extensions/driveImage/DriveImageExtension.js';
        import { PageLinkCard } from './extensions/pageLinkCard/PageLinkCard.js';
        import { WikiDataService } from './scripts/wikiDataService.js';

        const LOGIN_STORAGE_KEY = 'wikiLoginState';
        const APPS_SCRIPT_ENDPOINT_USER_SETTINGS = window.APPS_SCRIPT_ENDPOINT_USER_SETTINGS;
        const USER_SETTINGS_REQUEST_TIMEOUT = 20000;

        const loginStatusText = document.getElementById('login-status-text');
        const loginButton = document.getElementById('login-button');
        const logoutButton = document.getElementById('logout-button');
        const settingsButton = document.getElementById('settings-button');
        const wikiSettingsButton = document.getElementById('wiki-settings-button');
        const userSettingsOverlay = document.getElementById('user-settings-overlay');
        const userSettingsForm = document.getElementById('user-settings-form');
        const settingsUsernameInput = document.getElementById('settings-username');
        const settingsKingdomInput = document.getElementById('settings-kingdom');
        const settingsLanguageSelect = document.getElementById('settings-language');
        const userSettingsMessage = document.getElementById('user-settings-message');
        const userSettingsCancel = document.getElementById('user-settings-cancel');
        const userSettingsSubmit = document.getElementById('user-settings-submit');
        const pageMetaToggle = document.getElementById('page-meta-toggle');
        const pageMetaFields = document.getElementById('page-meta-fields');
        const pageMetaMobileMedia = window.matchMedia('(max-width: 600px)');

        const applyPageMetaLayout = (isMobile) => {
            if (!pageMetaToggle || !pageMetaFields) {
                return;
            }
            if (isMobile) {
                const expanded = pageMetaToggle.getAttribute('aria-expanded') === 'true';
                pageMetaFields.hidden = !expanded;
                pageMetaToggle.classList.toggle('is-open', expanded);
            } else {
                pageMetaFields.hidden = false;
                pageMetaToggle.setAttribute('aria-expanded', 'true');
                pageMetaToggle.classList.add('is-open');
            }
        };

        if (pageMetaToggle && pageMetaFields) {
            pageMetaToggle.addEventListener('click', () => {
                const expanded = pageMetaToggle.getAttribute('aria-expanded') === 'true';
                const nextExpanded = !expanded;
                pageMetaToggle.setAttribute('aria-expanded', String(nextExpanded));
                pageMetaToggle.classList.toggle('is-open', nextExpanded);
                if (pageMetaMobileMedia.matches) {
                    pageMetaFields.hidden = !nextExpanded;
                }
            });

            const handlePageMetaViewportChange = (event) => {
                applyPageMetaLayout(event.matches);
            };

            applyPageMetaLayout(pageMetaMobileMedia.matches);
            pageMetaMobileMedia.addEventListener('change', handlePageMetaViewportChange);
        }

        const userSettingsState = {
            isOpen: false,
            isSaving: false,
            isLoading: false,
            data: null,
            loginId: null
        };

        let lastLoginIdentifier = null;

        const urlParams = new URLSearchParams(window.location.search);
        const initialPageIdFromQuery = (urlParams.get('page') || '').trim();

        const getStoredLoginState = () => {
            try {
                const value = localStorage.getItem(LOGIN_STORAGE_KEY);
                return value ? JSON.parse(value) : null;
            } catch (error) {
                console.error('Failed to parse login state', error);
                return null;
            }
        };

        const clearStoredLoginState = () => {
            localStorage.removeItem(LOGIN_STORAGE_KEY);
        };

        const callUserSettingsApi = async (payload) => {
            if (!APPS_SCRIPT_ENDPOINT_USER_SETTINGS || APPS_SCRIPT_ENDPOINT_USER_SETTINGS.includes('YOUR_DEPLOYMENT_ID')) {
                throw new Error('ユーザー設定APIのエンドポイントが設定されていません。');
            }

            const controller = new AbortController();
            const timeoutId = window.setTimeout(() => controller.abort(), USER_SETTINGS_REQUEST_TIMEOUT);

            try {
                const response = await fetch(APPS_SCRIPT_ENDPOINT_USER_SETTINGS, {
                    method: 'POST',
                    mode: 'cors',
                    credentials: 'omit',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });

                if (!response.ok) {
                    const errorText = await response.text().catch(() => '');
                    throw new Error(`ユーザー設定の更新に失敗しました (HTTP ${response.status})${errorText ? `: ${errorText}` : ''}`);
                }

                const result = await response.json().catch(() => null);
                if (!result) {
                    throw new Error('ユーザー設定の応答解析に失敗しました。');
                }

                return result;
            } catch (error) {
                if (error.name === 'AbortError') {
                    throw new Error('ユーザー設定のリクエストがタイムアウトしました。');
                }
                if (error instanceof TypeError) {
                    throw new Error('ユーザー設定サービスに接続できませんでした。ネットワークまたはCORS設定を確認してください。');
                }
                throw error;
            } finally {
                window.clearTimeout(timeoutId);
            }
        };

        const buildLoginUrl = (pageId) => {
            const url = new URL('./login.html', window.location.href);
            url.searchParams.set('redirect', 'edit.html');
            const targetPage = (pageId || '').trim();
            if (targetPage) {
                url.searchParams.set('page', targetPage);
            }
            return url.toString();
        };

        const buildWikiSettingsUrl = () => {
            return new URL('./setting.html', window.location.href).toString();
        };

        function updateStoredLoginStateUser(updates) {
            if (!updates || typeof updates !== 'object') {
                return null;
            }
            const stored = getStoredLoginState();
            if (!stored?.user) {
                return null;
            }
            const updatedState = {
                ...stored,
                user: {
                    ...stored.user,
                    ...updates
                }
            };
            localStorage.setItem(LOGIN_STORAGE_KEY, JSON.stringify(updatedState));
            return updatedState;
        }

        function getDisplayName(user) {
            if (!user) {
                return '';
            }
            const username = (user.username || '').trim();
            if (username) {
                return username;
            }
            const name = (user.name || '').trim();
            if (name) {
                return name;
            }
            const email = (user.email || '').trim();
            if (email) {
                return email;
            }
            return '';
        }

        function sanitizeLanguage(value) {
            return value === 'en' ? 'en' : 'ja';
        }

        function parseAuthority(value) {
            if (value === null || value === undefined || value === '') {
                return null;
            }
            const number = Number(value);
            return Number.isFinite(number) ? number : null;
        }

        function getCurrentUserAuthority() {
            const loginState = getStoredLoginState();
            return parseAuthority(loginState?.user?.authority);
        }

        function setUserSettingsMessage(message, type = '') {
            if (!userSettingsMessage) {
                return;
            }
            userSettingsMessage.textContent = message || '';
            userSettingsMessage.classList.remove('error', 'success');
            if (type) {
                userSettingsMessage.classList.add(type);
            }
        }

        function fillUserSettingsForm(settings) {
            const storedState = getStoredLoginState();
            const storedUser = storedState?.user || {};
            const effectiveSettings = {
                username: settings?.username ?? storedUser.username ?? storedUser.name ?? '',
                kingdom: settings?.kingdom ?? storedUser.kingdom ?? '',
                language: sanitizeLanguage(settings?.language || storedUser.language || 'ja')
            };

            if (settingsUsernameInput) {
                settingsUsernameInput.value = effectiveSettings.username || '';
            }
            if (settingsKingdomInput) {
                settingsKingdomInput.value = effectiveSettings.kingdom != null ? effectiveSettings.kingdom : '';
            }
            if (settingsLanguageSelect) {
                settingsLanguageSelect.value = sanitizeLanguage(effectiveSettings.language);
            }
        }

        function openUserSettingsDialog() {
            if (!userSettingsOverlay) {
                return;
            }
            const loginState = getStoredLoginState();
            if (!loginState?.user) {
                handleLoginNavigation();
                return;
            }
            fillUserSettingsForm(userSettingsState.data);
            setUserSettingsMessage('');
            userSettingsOverlay.classList.add('visible');
            userSettingsOverlay.setAttribute('aria-hidden', 'false');
            userSettingsState.isOpen = true;
            window.setTimeout(() => {
                settingsUsernameInput?.focus();
            }, 0);
        }

        function closeUserSettingsDialog() {
            if (!userSettingsOverlay) {
                return;
            }
            userSettingsOverlay.classList.remove('visible');
            userSettingsOverlay.setAttribute('aria-hidden', 'true');
            userSettingsState.isOpen = false;
            if (userSettingsState.isSaving) {
                userSettingsState.isSaving = false;
                userSettingsSubmit?.removeAttribute('disabled');
            }
        }

        async function fetchAndApplyUserSettings(loginId, email, fallbackName) {
            if (!loginId) {
                return;
            }
            userSettingsState.isLoading = true;
            try {
                const result = await callUserSettingsApi({
                    action: 'getUserSettings',
                    loginId,
                    email
                });

                if (!result.success) {
                    throw new Error(result.message || 'ユーザー設定の取得に失敗しました。');
                }

                const settings = {
                    loginId: result.loginId || loginId,
                    username: result.username || fallbackName || '',
                    email: result.email || email,
                    kingdom: result.kingdom != null && result.kingdom !== '' ? String(result.kingdom) : '',
                    language: sanitizeLanguage((result.language || '').trim().toLowerCase()),
                    authority: parseAuthority(result.authority)
                };

                userSettingsState.data = settings;
                userSettingsState.loginId = settings.loginId;
                if (!userSettingsState.isOpen) {
                    fillUserSettingsForm(settings);
                }
                updateStoredLoginStateUser({
                    username: settings.username,
                    loginId: settings.loginId,
                    email: settings.email,
                    kingdom: settings.kingdom,
                    language: settings.language,
                    authority: settings.authority
                });
                updateLoginUI();
            } catch (error) {
                console.error('ユーザー設定の取得中にエラーが発生しました。', error);
                if (userSettingsState.isOpen) {
                    setUserSettingsMessage(error.message || 'ユーザー設定の取得に失敗しました。', 'error');
                }
            } finally {
                userSettingsState.isLoading = false;
            }
        }

        const handleUserSettingsSubmit = async (event) => {
            event.preventDefault();
            if (userSettingsState.isSaving) {
                return;
            }

            const loginState = getStoredLoginState();
            const user = loginState?.user;
            if (!user) {
                setUserSettingsMessage('ログインが必要です。', 'error');
                return;
            }

            const username = (settingsUsernameInput?.value || '').trim();
            if (!username) {
                setUserSettingsMessage('ユーザーネームを入力してください。', 'error');
                settingsUsernameInput?.focus();
                return;
            }

            const rawKingdom = (settingsKingdomInput?.value || '').trim();
            const normalizedKingdom = rawKingdom ? rawKingdom.replace(/[^0-9]/g, '') : '';
            const language = sanitizeLanguage(settingsLanguageSelect?.value || 'ja');

            userSettingsState.isSaving = true;
            userSettingsSubmit?.setAttribute('disabled', 'true');
            setUserSettingsMessage('保存しています...');

            try {
                const payload = {
                    action: 'updateUserSettings',
                    loginId: user.loginId || user.email || '',
                    email: user.email || '',
                    username,
                    kingdom: normalizedKingdom,
                    language
                };

                const result = await callUserSettingsApi(payload);
                if (!result.success) {
                    throw new Error(result.message || 'ユーザー設定の保存に失敗しました。');
                }

                const updatedSettings = {
                    loginId: result.loginId || payload.loginId,
                    username: result.username || username,
                    email: result.email || payload.email,
                    kingdom: result.kingdom != null && result.kingdom !== '' ? String(result.kingdom) : normalizedKingdom,
                    language: sanitizeLanguage((result.language || language).toLowerCase()),
                    authority: parseAuthority(result.authority)
                };

                userSettingsState.data = updatedSettings;
                userSettingsState.loginId = updatedSettings.loginId;
                fillUserSettingsForm(updatedSettings);
                updateStoredLoginStateUser({
                    username: updatedSettings.username,
                    loginId: updatedSettings.loginId,
                    email: updatedSettings.email,
                    language: updatedSettings.language,
                    kingdom: updatedSettings.kingdom,
                    authority: updatedSettings.authority
                });
                setUserSettingsMessage('保存しました。', 'success');
                updateLoginUI();
            } catch (error) {
                console.error('ユーザー設定の保存中にエラーが発生しました。', error);
                setUserSettingsMessage(error.message || 'ユーザー設定の保存に失敗しました。', 'error');
            } finally {
                userSettingsState.isSaving = false;
                userSettingsSubmit?.removeAttribute('disabled');
            }
        };

        const updateLoginUI = () => {
            const loginState = getStoredLoginState();
            const displayName = getDisplayName(loginState?.user);

            if (displayName) {
                loginStatusText.textContent = `${displayName} としてログイン中`;
                loginButton.hidden = true;
                logoutButton.hidden = false;
                settingsButton.hidden = false;
                settingsButton.disabled = false;
                const loginId = (loginState?.user?.loginId || '').trim().toLowerCase();
                const isAdmin = loginId === 'admin';
                if (wikiSettingsButton) {
                    wikiSettingsButton.hidden = !isAdmin;
                    wikiSettingsButton.disabled = !isAdmin;
                }
            } else {
                loginStatusText.textContent = '未ログイン';
                loginButton.hidden = false;
                logoutButton.hidden = true;
                settingsButton.hidden = true;
                settingsButton.disabled = true;
                if (wikiSettingsButton) {
                    wikiSettingsButton.hidden = true;
                    wikiSettingsButton.disabled = true;
                }
                userSettingsState.data = null;
                userSettingsState.loginId = null;
                if (userSettingsState.isOpen) {
                    closeUserSettingsDialog();
                }
            }

            const loginIdentifier = loginState?.user ? (loginState.user.loginId || loginState.user.email || '') : '';
            if (loginIdentifier && loginIdentifier !== lastLoginIdentifier) {
                lastLoginIdentifier = loginIdentifier;
                fetchAndApplyUserSettings(loginIdentifier, loginState?.user?.email || '', displayName);
            } else if (!loginIdentifier && lastLoginIdentifier) {
                lastLoginIdentifier = null;
            }
        };

        const handleLoginNavigation = () => {
            const targetPage = state.currentPageId || initialPageIdFromQuery || '';
            window.location.href = buildLoginUrl(targetPage);
        };

        const handleLogout = () => {
            const state = getStoredLoginState();
            if (state?.accessToken) {
                fetch('https://oauth2.googleapis.com/revoke', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `token=${encodeURIComponent(state.accessToken)}`
                }).catch((error) => {
                    console.warn('Failed to revoke token', error);
                });
            }
            clearStoredLoginState();
            userSettingsState.data = null;
            userSettingsState.loginId = null;
            lastLoginIdentifier = null;
            updateLoginUI();
        };

        const handleWikiSettingsNavigation = () => {
            window.location.href = buildWikiSettingsUrl();
        };

        loginButton?.addEventListener('click', handleLoginNavigation);
        logoutButton?.addEventListener('click', handleLogout);
        settingsButton?.addEventListener('click', openUserSettingsDialog);
        wikiSettingsButton?.addEventListener('click', handleWikiSettingsNavigation);
        userSettingsCancel?.addEventListener('click', () => {
            closeUserSettingsDialog();
        });
        userSettingsOverlay?.addEventListener('click', (event) => {
            if (event.target === userSettingsOverlay) {
                closeUserSettingsDialog();
            }
        });
        userSettingsForm?.addEventListener('submit', handleUserSettingsSubmit);

        window.addEventListener('storage', (event) => {
            if (event.key === LOGIN_STORAGE_KEY) {
                updateLoginUI();
            }
        });

        updateLoginUI();

        if (!getStoredLoginState()?.user) {
            window.location.replace(buildLoginUrl(initialPageIdFromQuery));
        }

        const YouTubeEmbed = Node.create({
            name: 'youtube',
            group: 'block',
            atom: true,
            draggable: true,
            selectable: true,
            isolating: true,
            addOptions() {
                return {
                    HTMLAttributes: {
                        class: 'youtube-embed',
                        frameborder: '0',
                        allow: 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share',
                        allowfullscreen: 'true',
                        title: 'YouTube video player'
                    }
                };
            },
            addAttributes() {
                return {
                    src: {
                        default: null
                    },
                    videoId: {
                        default: null
                    },
                    start: {
                        default: null
                    }
                };
            },
            parseHTML() {
                return [
                    {
                        tag: 'iframe[src*="youtube.com/embed"]',
                        getAttrs: dom => {
                            if (!(dom instanceof HTMLElement)) {
                                return false;
                            }
                            const src = dom.getAttribute('src') || '';
                            const dataVideoId = dom.getAttribute('data-video-id');
                            const dataStart = dom.getAttribute('data-start');
                            let videoId = dataVideoId || null;
                            let start = null;
                            if (dataStart !== null && dataStart !== '') {
                                const parsedStart = Number(dataStart);
                                if (Number.isFinite(parsedStart) && parsedStart > 0) {
                                    start = parsedStart;
                                }
                            }
                            if (!videoId) {
                                const extracted = extractYouTubeDataFromEmbedSrc(src);
                                videoId = extracted.videoId;
                                if (!start && extracted.startSeconds > 0) {
                                    start = extracted.startSeconds;
                                }
                            }
                            if (!videoId) {
                                return false;
                            }
                            return {
                                src,
                                videoId,
                                start
                            };
                        }
                    }
                ];
            },
            renderHTML({ HTMLAttributes }) {
                const attrs = { ...HTMLAttributes };
                const videoId = attrs.videoId || null;
                const start = attrs.start ?? null;
                if (videoId) {
                    const startSeconds = typeof start === 'number' ? start : Number(start) || 0;
                    attrs.src = createYouTubeEmbedSrc(videoId, startSeconds);
                }
                const dataAttrs = {
                    'data-video-id': videoId || undefined,
                    'data-start': start != null && start !== '' ? (typeof start === 'number' ? start : Number(start) || undefined) : undefined
                };
                delete attrs.videoId;
                delete attrs.start;
                if (dataAttrs['data-start'] === undefined) {
                    delete dataAttrs['data-start'];
                }
                return ['iframe', mergeAttributes(this.options.HTMLAttributes, attrs, dataAttrs)];

        function parseYouTubeTime(value) {
            if (!value) {
                return 0;
            }
            const stringValue = String(value).trim();
            if (!stringValue) {
                return 0;
            }
            if (/^\d+$/.test(stringValue)) {
                return Math.max(parseInt(stringValue, 10), 0);
            }
            let total = 0;
            let matched = false;
            const timePattern = /(\d+)([hms])/gi;
            let match;
            while ((match = timePattern.exec(stringValue)) !== null) {
                matched = true;
                const amount = parseInt(match[1], 10);
                const unit = match[2].toLowerCase();
                if (unit === 'h') {
                    total += amount * 3600;
                } else if (unit === 'm') {
                    total += amount * 60;
                } else if (unit === 's') {
                    total += amount;
                }
            }
            if (matched) {
                return total;
            }
            if (stringValue.includes(':')) {
                const parts = stringValue.split(':').map(part => part.trim());
                if (parts.every(part => /^\d+$/.test(part))) {
                    let multiplier = 1;
                    for (let index = parts.length - 1; index >= 0; index -= 1) {
                        total += parseInt(parts[index], 10) * multiplier;
                        multiplier *= 60;
                    }
                    return total;
                }
            }
            return 0;
        }

        function createYouTubeEmbedSrc(videoId, startSeconds = 0) {
            const normalizedId = (videoId || '').trim().replace(/[^a-zA-Z0-9_-]/g, '');
            if (!normalizedId) {
                return '';
            }
            const url = new URL(`https://www.youtube.com/embed/${normalizedId}`);
            const seconds = Number.isFinite(startSeconds) ? Math.max(Math.floor(startSeconds), 0) : 0;
            if (seconds > 0) {
                url.searchParams.set('start', String(seconds));
            }
            url.searchParams.set('rel', '0');
            url.searchParams.set('modestbranding', '1');
            return url.toString();
        }

        function parseYouTubeUrl(rawUrl) {
            if (!rawUrl) {
                return null;
            }
            const trimmed = rawUrl.trim();
            if (!trimmed) {
                return null;
            }
            const normalized = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
            let url;
            try {
                url = new URL(normalized);
            } catch (error) {
                return null;
            }
            const hostname = url.hostname.replace(/^www\./i, '').toLowerCase();
            let videoId = null;
            if (hostname === 'youtu.be') {
                const segments = url.pathname.split('/').filter(Boolean);
                videoId = segments[segments.length - 1] || null;
            } else if (hostname === 'youtube.com' || hostname.endsWith('.youtube.com') || hostname === 'youtube-nocookie.com') {
                const path = url.pathname.replace(/\/+$/, '');
                if (path === '/watch') {
                    videoId = url.searchParams.get('v');
                } else if (path.startsWith('/shorts/')) {
                    const segments = path.split('/').filter(Boolean);
                    videoId = segments[segments.length - 1] || null;
                } else if (path.startsWith('/embed/')) {
                    const segments = path.split('/').filter(Boolean);
                    videoId = segments[segments.length - 1] || null;
                } else if (path.startsWith('/live/')) {
                    const segments = path.split('/').filter(Boolean);
                    videoId = segments[segments.length - 1] || null;
                }
                if (!videoId) {
                    videoId = url.searchParams.get('v');
                }
            }
            if (!videoId) {
                return null;
            }
            const normalizedId = videoId.replace(/[^a-zA-Z0-9_-]/g, '');
            if (!normalizedId) {
                return null;
            }
            const startParam = url.searchParams.get('t') || url.searchParams.get('start');
            const startSeconds = parseYouTubeTime(startParam);
            return {
                rawUrl: trimmed,
                normalizedUrl: url.toString(),
                videoId: normalizedId,
                startSeconds
            };
        }

        function extractYouTubeDataFromEmbedSrc(src) {
            if (!src) {
                return { videoId: null, startSeconds: 0 };
            }
            let url;
            try {
                url = new URL(src, 'https://www.youtube.com');
            } catch (error) {
                return { videoId: null, startSeconds: 0 };
            }
            const segments = url.pathname.split('/').filter(Boolean);
            let videoId = null;
            if (segments.length >= 2 && segments[0] === 'embed') {
                videoId = segments[1] || null;
            }
            const startSeconds = parseYouTubeTime(url.searchParams.get('start'));
            return {
                videoId: videoId ? videoId.replace(/[^a-zA-Z0-9_-]/g, '') : null,
                startSeconds
            };
        }

            try {
                coords = view.coordsAtPos(Math.max(from, 0));

            const containerRect = elements.editorContainer?.getBoundingClientRect();
            const popup = elements.youtubePastePopup;

            popup.classList.add('visible');
            popup.setAttribute('aria-hidden', 'false');
            popup.style.visibility = 'hidden';
            popup.style.left = '0px';
            popup.style.top = '0px';
            requestAnimationFrame(() => {
                const popupRect = popup.getBoundingClientRect();
                const left = coords.left - containerRect.left - popupRect.width / 2;
                const top = coords.bottom - containerRect.top + 12;
                const maxLeft = containerRect.width - popupRect.width - 16;
                const clampedLeft = Math.min(Math.max(left, 16), Math.max(maxLeft, 16));
                const maxTop = containerRect.height - popupRect.height - 16;
                const clampedTop = Math.min(Math.max(top, 16), Math.max(maxTop, 16));
                popup.style.left = `${clampedLeft}px`;

        function createPageLinkCardElement(doc, data) {
            const card = doc.createElement('a');
            card.className = 'page-link-card';
            card.setAttribute('data-page-link-card', '');
            const href = data.href || (data.pageId ? `./view.html?page=${encodeURIComponent(data.pageId)}` : '#');
            card.setAttribute('href', href);
            card.setAttribute('target', '_blank');
            card.setAttribute('rel', 'noopener noreferrer');
            if (data.pageId) {
                card.setAttribute('data-page-id', data.pageId);
            }
            if (data.title) {
                card.setAttribute('data-page-title', data.title);
                card.setAttribute('title', data.title);
            }
            if (data.description) {
                card.setAttribute('data-page-description', data.description);
            }
            const titleDiv = doc.createElement('div');
            titleDiv.className = 'page-link-card__title';
            titleDiv.textContent = data.title || data.pageId || '未指定のページ';
            card.appendChild(titleDiv);
            const metaText = data.description || data.pageId || '';
            if (metaText) {
                const metaDiv = doc.createElement('div');
                metaDiv.className = 'page-link-card__meta';
                metaDiv.textContent = metaText;
                card.appendChild(metaDiv);
            }
            const descendants = card.querySelectorAll('[data-page-link-card]');
            descendants.forEach(descendant => {
                if (descendant !== card) {
                    descendant.removeAttribute('data-page-link-card');
                }
            });
            return card;
        }

        function normalizePageLinkCards(html) {
            if (!html) {
                return '';
            }
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const body = doc.body;
            const anchors = Array.from(body.querySelectorAll('a.page-link-card, a[data-page-link-card]'));
            anchors.forEach(anchor => {
                const data = extractPageLinkData(anchor);
                const card = createPageLinkCardElement(doc, data);
                const parent = anchor.parentElement;
                if (parent && parent.tagName === 'P' && parent.childElementCount === 1) {
                    parent.replaceWith(card);
                } else {
                    anchor.replaceWith(card);
                }
            });
            return body.innerHTML;
        }

        function isSlugTaken(parentId, slug, excludeId = null) {
            if (!slug) {
                return false;
            }
            const normalizedParent = parentId || null;
            for (const node of state.pageMap.values()) {
                if (excludeId && node.id === excludeId) {
                    continue;
                }
                if (node.parentId === normalizedParent && node.slug === slug) {
                    return true;
                }
            }
            return false;
        }

        function generateUniqueSlug(parentId, baseSlug, excludeId = null) {
            const normalizedBase = normalizeSlug(baseSlug || '');
            const candidateBase = normalizedBase || 'page';
            let candidate = candidateBase;
            let index = 2;
            while (isSlugTaken(parentId, candidate, excludeId)) {
                candidate = `${candidateBase}${index}`;
                index += 1;
            }
            return candidate;
        }

        function isDescendantId(id, potentialAncestor) {
            if (!id || !potentialAncestor) {
                return false;
            }
            return id === potentialAncestor || id.startsWith(`${potentialAncestor}/`);
        }

        function updateProvisionalPageId(slug) {
            if (!state.isNewPage || !state.currentPageId) {
                return;
            }
            const normalizedSlug = slug || '';
            const parentId = state.currentParentId;
            const newId = normalizedSlug
                ? (parentId ? `${parentId}/${normalizedSlug}` : normalizedSlug)
                : null;
            const oldId = state.currentPageId;
            if (!newId || newId === oldId) {
                return;
            }
            if (isSlugTaken(parentId, normalizedSlug, oldId)) {
                return;
            }
            const node = state.pageMap.get(oldId);
            if (!node) {
                return;
            }
            removeNode(oldId);
            node.id = newId;
            node.slug = normalizedSlug;
            node.parentId = parentId || null;
            insertNode(node);
            state.currentPageId = newId;
            renderTree();
        }

        function getParentId(id) {
            if (!id) return null;
            const parts = id.split('/');
